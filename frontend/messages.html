<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Creator OS — Messages</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Inter",
                sans-serif;

            background: #f5f5f7;

            color: #111;

        }


        .container {

            max-width: 1100px;

            margin: auto;

            padding: 35px 20px;

        }


        .back {

            color: #666;

            text-decoration: none;

            font-size: 14px;

        }


        h1 {

            font-size: 34px;

            margin-top: 30px;

            letter-spacing: -1px;

        }


        .subtitle {

            color: #777;

            margin-top: 8px;

            margin-bottom: 30px;

        }


        .panel {

            background: white;

            border: 1px solid #e5e5e5;

            border-radius: 18px;

            overflow: hidden;

        }


        .table-header,
        .row {

            display: grid;

            grid-template-columns:
                3fr 1fr 1fr 1fr;

            gap: 15px;

            padding: 18px 20px;

            align-items: center;

        }


        .table-header {

            background: #fafafa;

            font-size: 12px;

            color: #777;

            font-weight: 600;

        }


        .row {

            border-top: 1px solid #eee;

            font-size: 14px;

        }


        .message {

            line-height: 1.4;

        }


        .rate {

            font-weight: 700;

        }


        .empty {

            padding: 40px;

            text-align: center;

            color: #777;

        }


        @media(max-width:700px) {

            .table-header,
            .row {

                grid-template-columns:
                    2fr 1fr 1fr;

            }

            .time {

                display: none;

            }

        }

    </style>

</head>


<body>


<div class="container">


    <a
        href="index.html"
        class="back"
    >
        ← Dashboard
    </a>


    <h1>
        Message Analytics
    </h1>


    <p class="subtitle">
        See which messages generate replies.
    </p>


    <div class="panel">


        <div class="table-header">

            <div>
                Message
            </div>

            <div>
                Sent
            </div>

            <div>
                Reply Rate
            </div>

            <div class="time">
                Avg Response
            </div>

        </div>


        <div id="messages">

            <div class="empty">
                Loading analytics...
            </div>

        </div>


    </div>


</div>


<script>


async function loadMessages() {

    const container =
        document.getElementById(
            "messages"
        );


    try {

        const response =
            await fetch(
                "http://localhost:8000/api/dashboard"
            );


        const data =
            await response.json();


        const messages =
            data.message_performance || [];


        if (!messages.length) {

            container.innerHTML = `
                <div class="empty">
                    No message data available.
                </div>
            `;

            return;

        }


        container.innerHTML = "";


        messages.forEach(
            message => {

                const row =
                    document.createElement(
                        "div"
                    );


                row.className = "row";


                row.innerHTML = `

                    <div class="message">
                        ${escapeHtml(
                            message.message
                        )}
                    </div>

                    <div>
                        ${message.times_sent}
                    </div>

                    <div class="rate">
                        ${message.reply_rate_percent}%
                    </div>

                    <div class="time">
                        ${
                            message.average_response_seconds
                            !== null
                            ? formatTime(
                                message.average_response_seconds
                              )
                            : "—"
                        }
                    </div>

                `;


                container.appendChild(row);

            }
        );


    } catch (error) {

        container.innerHTML = `
            <div class="empty">
                Could not connect to API.
            </div>
        `;

    }

}


function formatTime(seconds) {

    if (seconds < 60) {

        return Math.round(seconds) + "s";

    }


    const minutes =
        Math.floor(seconds / 60);

    const remaining =
        Math.round(seconds % 60);


    return `${minutes}m ${remaining}s`;

}


function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


loadMessages();

</script>


</body>

</html>
