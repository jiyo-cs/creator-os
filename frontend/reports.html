<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Creator OS — Reports</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Inter",
        Arial,
        sans-serif;

    background: #f5f5f5;

    color: #111;

    min-height: 100vh;
}


/* =========================
   PAGE CONTENT
========================= */

.main {

    margin-left: 230px;

    min-height: 100vh;
}

.container {

    max-width: 1100px;

    margin: auto;

    padding:
        50px
        30px
        40px;
}


/* =========================
   HEADER
========================= */

.header {

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    gap: 20px;

    margin-bottom: 30px;
}

.header h1 {

    margin: 0;

    font-size: 32px;

    letter-spacing: -1px;
}

.header p {

    color: #777;

    margin-top: 6px;
}


/* =========================
   PERIOD SELECTOR
========================= */

.period-select {

    padding:
        11px
        14px;

    border:
        1px solid #ddd;

    border-radius: 10px;

    background: white;

    font-size: 14px;

    cursor: pointer;

    outline: none;
}

.period-select:focus {

    border-color: #999;
}


/* =========================
   REPORT GRID
========================= */

.stats-grid {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 15px;

    margin-bottom: 25px;
}


/* =========================
   CARD
========================= */

.card {

    background: white;

    padding: 22px;

    border-radius: 16px;

    border:
        1px solid #e8e8e8;

    margin-bottom: 15px;
}

.stats-grid .card {

    margin-bottom: 0;
}

.card span {

    display: block;

    color: #777;

    font-size: 13px;

    margin-bottom: 10px;
}

.card strong {

    font-size: 27px;
}

.card h2 {

    margin-top: 0;

    margin-bottom: 15px;

    font-size: 20px;
}


/* =========================
   EMPTY
========================= */

.empty {

    background: white;

    padding: 30px;

    border-radius: 16px;

    color: #777;
}

.empty h2 {

    color: #111;

    margin-top: 0;
}

.empty p {

    line-height: 1.5;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 800px) {

    .main {

        margin-left: 0;

    }

    .container {

        padding:
            30px
            15px
            30px;

    }

    .header {

        align-items:
            flex-start;

        flex-direction:
            column;

    }

    .header h1 {

        font-size: 28px;

    }

    .period-select {

        width: 100%;

    }

    .stats-grid {

        grid-template-columns:
            repeat(2, 1fr);

    }

}


@media (max-width: 500px) {

    .stats-grid {

        grid-template-columns:
            1fr;

    }

}

</style>

</head>


<body>


<!-- =========================
     SHARED NAVIGATION
========================= -->

<div id="appNav"></div>


<!-- =========================
     MAIN CONTENT
========================= -->

<main class="main">

    <div class="container">


        <!-- HEADER -->

        <div class="header">

            <div>

                <h1>
                    Performance Report
                </h1>

                <p>
                    Creator OS DM optimization report
                </p>

            </div>


            <select
                id="period"
                class="period-select"
            >

                <option value="7d">
                    Last 7 days
                </option>

                <option value="30d">
                    Last 30 days
                </option>

                <option value="all_time">
                    All time
                </option>

            </select>

        </div>


        <!-- REPORT -->

        <div id="report">

            <div class="empty">

                Loading report...

            </div>

        </div>


    </div>

</main>


<!-- =========================
     SCRIPTS
========================= -->

<script src="config.js"></script>

<script src="nav.js"></script>


<script>


/* =========================
   PERIOD
========================= */

const periodSelect =
    document.getElementById(
        "period"
    );


periodSelect.addEventListener(
    "change",
    loadReport
);


/* =========================
   LOAD REPORT
========================= */

async function loadReport() {

    const period =
        periodSelect.value;


    try {

        const response =
            await fetch(
                `${API_URL}/api/reports/latest?period=${period}`
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.detail ||
                "Could not load report"
            );

        }


        if (!data.report) {

            showEmptyState();

            return;

        }


        renderReport(
            data.report
        );


    } catch (error) {

        document.getElementById(
            "report"
        ).innerHTML = `

            <div class="card">

                <h3>
                    Report unavailable
                </h3>

                <p>
                    ${escapeHtml(
                        error.message
                    )}
                </p>

            </div>

        `;

        console.error(error);

    }

}


/* =========================
   RENDER REPORT
========================= */

function renderReport(report) {

    const summary =
        report.summary || {};


    const reportContainer =
        document.getElementById(
            "report"
        );


    reportContainer.innerHTML = `

        <div class="stats-grid">


            <div class="card">

                <span>
                    Conversations
                </span>

                <strong>
                    ${summary.total_conversations ?? 0}
                </strong>

            </div>


            <div class="card">

                <span>
                    Reply Rate
                </span>

                <strong>
                    ${summary.reply_rate_percent ?? 0}%
                </strong>

            </div>


            <div class="card">

                <span>
                    Avg Response
                </span>

                <strong>

                    ${escapeHtml(
                        summary.average_response_time ||
                        "N/A"
                    )}

                </strong>

            </div>


            <div class="card">

                <span>
                    Creator Messages
                </span>

                <strong>
                    ${summary.creator_messages ?? 0}
                </strong>

            </div>


        </div>


        <div class="card">

            <h2>
                Top Performing Messages
            </h2>

            ${renderMessages(
                report.top_messages || []
            )}

        </div>


        <div class="card">

            <h2>
                Biggest Drop-offs
            </h2>

            ${renderDropoffs(
                report.biggest_dropoffs || []
            )}

        </div>


        <div class="card">

            <h2>
                Key Insights
            </h2>

            ${renderInsights(
                report.insights || []
            )}

        </div>


        <div class="card">

            <h2>
                Recommended Actions
            </h2>

            ${renderRecommendations(
                report.recommendations || []
            )}

        </div>

    `;

}


/* =========================
   TOP MESSAGES
========================= */

function renderMessages(messages) {

    if (!messages.length) {

        return `
            <p>
                No message data available.
            </p>
        `;

    }


    return messages.map(
        message => `

            <div
                style="
                    padding:14px 0;
                    border-bottom:1px solid #eee;
                "
            >

                <strong>
                    ${escapeHtml(
                        message.message
                    )}
                </strong>

                <div
                    style="
                        margin-top:7px;
                        color:#777;
                        font-size:14px;
                    "
                >

                    Sent:
                    ${message.times_sent ?? 0}

                    &nbsp; • &nbsp;

                    Reply rate:
                    ${message.reply_rate_percent ?? 0}%

                </div>

            </div>

        `
    ).join("");

}


/* =========================
   DROPOFFS
========================= */

function renderDropoffs(dropoffs) {

    if (!dropoffs.length) {

        return `
            <p>
                No sequence drop-off data yet.
            </p>
        `;

    }


    return dropoffs.map(
        item => `

            <div
                style="
                    padding:14px 0;
                    border-bottom:1px solid #eee;
                "
            >

                <strong>
                    ${escapeHtml(
                        item.step
                    )}
                </strong>

                <div
                    style="
                        margin-top:7px;
                        color:#777;
                    "
                >

                    Drop-off:
                    ${item.dropoff_rate_percent ?? 0}%

                    &nbsp; • &nbsp;

                    Entered:
                    ${item.entered ?? 0}

                </div>

            </div>

        `
    ).join("");

}


/* =========================
   INSIGHTS
========================= */

function renderInsights(insights) {

    if (!insights.length) {

        return `
            <p>
                No insights available.
            </p>
        `;

    }


    return insights.map(
        insight => `

            <div
                style="
                    padding:14px 0;
                    border-bottom:1px solid #eee;
                "
            >

                <strong>
                    ${escapeHtml(
                        insight.title
                    )}
                </strong>

                <p
                    style="
                        color:#777;
                        margin-top:6px;
                    "
                >

                    ${escapeHtml(
                        insight.description
                    )}

                </p>

            </div>

        `
    ).join("");

}


/* =========================
   RECOMMENDATIONS
========================= */

function renderRecommendations(
    recommendations
) {

    if (!recommendations.length) {

        return `
            <p>
                No recommendations yet.
            </p>
        `;

    }


    return recommendations.map(
        recommendation => `

            <div
                style="
                    padding:14px 0;
                    border-bottom:1px solid #eee;
                "
            >

                <strong>
                    ${escapeHtml(
                        recommendation.title
                    )}
                </strong>

                <p
                    style="
                        color:#777;
                        margin-top:6px;
                    "
                >

                    ${escapeHtml(
                        recommendation.description
                    )}

                </p>

            </div>

        `
    ).join("");

}


/* =========================
   EMPTY STATE
========================= */

function showEmptyState() {

    document.getElementById(
        "report"
    ).innerHTML = `

        <div class="card">

            <h2>
                No data yet
            </h2>

            <p>
                Import conversations to
                generate a performance report.
            </p>

        </div>

    `;

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value) {

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =========================
   INITIAL LOAD
========================= */

loadReport();

</script>


</body>

</html>
