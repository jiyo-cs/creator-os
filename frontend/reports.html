<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Creator OS — Report</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #111;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 40px 20px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
}

.header h1 {
    margin: 0;
}

.back {
    text-decoration: none;
    color: #555;
}

.grid {
    display: grid;
    grid-template-columns:
        repeat(4, 1fr);
    gap: 15px;
    margin-bottom: 30px;
}

.card {
    background: white;
    padding: 22px;
    border-radius: 16px;
    border: 1px solid #e8e8e8;
}

.label {
    color: #777;
    font-size: 13px;
    margin-bottom: 10px;
}

.value {
    font-size: 27px;
    font-weight: bold;
}

.section {
    margin-bottom: 30px;
}

.section h2 {
    margin-bottom: 15px;
}

.message,
.insight,
.recommendation {
    background: white;
    padding: 20px;
    border-radius: 14px;
    margin-bottom: 10px;
    border: 1px solid #e8e8e8;
}

.message p,
.insight p,
.recommendation p {
    color: #666;
    line-height: 1.5;
}

.empty {
    background: white;
    padding: 30px;
    border-radius: 16px;
    color: #777;
}

@media (max-width: 800px) {

    .grid {
        grid-template-columns:
            repeat(2, 1fr);
    }

}

@media (max-width: 500px) {

    .grid {
        grid-template-columns: 1fr;
    }

}

</style>

</head>


<body>

<div class="container">
    <div
    style="
        display:flex;
        justify-content:space-between;
        align-items:center;
        gap:12px;
        margin-bottom:25px;
        flex-wrap:wrap;
    "
>

    <div>
        <h1 style="margin:0;">
            Performance Report
        </h1>

        <p
            style="
                color:#777;
                margin-top:6px;
            "
        >
            DM performance and optimization report
        </p>
    </div>

    <select
        id="period"
        style="
            padding:11px 14px;
            border:1px solid #ddd;
            border-radius:10px;
            background:white;
            font-size:14px;
        "
    >
        <option value="7d">
            Last 7 days
        </option>

        <option value="30d">
            Last 30 days
        </option>

        <option value="all_time">
            All time
        </option>
    </select>

</div>
    <div class="header">

        <div>

            <h1>
                Performance Report
            </h1>

            <p>
                Creator OS DM optimization report
            </p>

        </div>

        <a
            href="index.html"
            class="back"
        >
            ← Dashboard
        </a>

    </div>


    <div id="report">

        <div class="empty">
            Loading report...
        </div>

    </div>

</div>

<script src="config.js"></script>
    
<script>
const periodSelect =
    document.getElementById("period");


periodSelect.addEventListener(
    "change",
    loadReport
);


async function loadReport() {

    const period =
        periodSelect.value;

    try {

        const response =
            await fetch(
                `${API_URL}/api/reports/latest?period=${period}`
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.detail ||
                "Could not load report"
            );

        }

        if (!data.report) {

            showEmptyState();

            return;
        }

        renderReport(
            data.report
        );

    } catch (error) {

        document.getElementById(
            "report"
        ).innerHTML = `

            <div class="card">

                <h3>
                    Report unavailable
                </h3>

                <p>
                    ${escapeHtml(
                        error.message
                    )}
                </p>

            </div>

        `;

    }
}


function renderReport(report) {

    const summary =
        report.summary;

    const reportContainer =
        document.getElementById(
            "report"
        );

    reportContainer.innerHTML = `

        <div class="stats-grid">

            <div class="card">
                <span>
                    Conversations
                </span>

                <strong>
                    ${summary.total_conversations}
                </strong>
            </div>

            <div class="card">
                <span>
                    Reply Rate
                </span>

                <strong>
                    ${summary.reply_rate_percent}%
                </strong>
            </div>

            <div class="card">
                <span>
                    Avg Response
                </span>

                <strong>
                    ${escapeHtml(
                        summary.average_response_time
                    )}
                </strong>
            </div>

            <div class="card">
                <span>
                    Creator Messages
                </span>

                <strong>
                    ${summary.creator_messages}
                </strong>
            </div>

        </div>


        <div class="card">

            <h2>
                Top Performing Messages
            </h2>

            ${renderMessages(
                report.top_messages
            )}

        </div>


        <div class="card">

            <h2>
                Biggest Drop-offs
            </h2>

            ${renderDropoffs(
                report.biggest_dropoffs
            )}

        </div>


        <div class="card">

            <h2>
                Key Insights
            </h2>

            ${renderInsights(
                report.insights
            )}

        </div>


        <div class="card">

            <h2>
                Recommended Actions
            </h2>

            ${renderRecommendations(
                report.recommendations
            )}

        </div>

    `;
}


function renderMessages(messages) {

    if (!messages.length) {

        return `
            <p>
                No message data available.
            </p>
        `;
    }

    return messages.map(
        message => `

            <div
                style="
                    padding:14px 0;
                    border-bottom:1px solid #eee;
                "
            >

                <strong>
                    ${escapeHtml(
                        message.message
                    )}
                </strong>

                <div
                    style="
                        margin-top:7px;
                        color:#777;
                        font-size:14px;
                    "
                >

                    Sent:
                    ${message.times_sent}

                    &nbsp; • &nbsp;

                    Reply rate:
                    ${message.reply_rate_percent}%

                </div>

            </div>

        `
    ).join("");
}


function renderDropoffs(dropoffs) {

    if (!dropoffs.length) {

        return `
            <p>
                No sequence drop-off data yet.
            </p>
        `;
    }

    return dropoffs.map(
        item => `

            <div
                style="
                    padding:14px 0;
                    border-bottom:1px solid #eee;
                "
            >

                <strong>
                    ${escapeHtml(
                        item.step
                    )}
                </strong>

                <div
                    style="
                        margin-top:7px;
                        color:#777;
                    "
                >

                    Drop-off:
                    ${item.dropoff_rate_percent}%

                    &nbsp; • &nbsp;

                    Entered:
                    ${item.entered}

                </div>

            </div>

        `
    ).join("");
}


function renderInsights(insights) {

    if (!insights.length) {

        return `
            <p>
                No insights available.
            </p>
        `;
    }

    return insights.map(
        insight => `

            <div
                style="
                    padding:14px 0;
                    border-bottom:1px solid #eee;
                "
            >

                <strong>
                    ${escapeHtml(
                        insight.title
                    )}
                </strong>

                <p
                    style="
                        color:#777;
                        margin-top:6px;
                    "
                >
                    ${escapeHtml(
                        insight.description
                    )}
                </p>

            </div>

        `
    ).join("");
}


function renderRecommendations(
    recommendations
) {

    if (!recommendations.length) {

        return `
            <p>
                No recommendations yet.
            </p>
        `;
    }

    return recommendations.map(
        recommendation => `

            <div
                style="
                    padding:14px 0;
                    border-bottom:1px solid #eee;
                "
            >

                <strong>
                    ${escapeHtml(
                        recommendation.title
                    )}
                </strong>

                <p
                    style="
                        color:#777;
                        margin-top:6px;
                    "
                >
                    ${escapeHtml(
                        recommendation.description
                    )}
                </p>

            </div>

        `
    ).join("");
}


function showEmptyState() {

    document.getElementById(
        "report"
    ).innerHTML = `

        <div class="card">

            <h2>
                No data yet
            </h2>

            <p>
                Import conversations to
                generate a performance report.
            </p>

        </div>

    `;
}


function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


loadReport();

</script>

</body>

</html>
