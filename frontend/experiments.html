<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Creator OS — Experiments</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Inter",
        Arial,
        sans-serif;

    background: #f5f5f5;

    color: #111;

    min-height: 100vh;
}


/* =========================
   MAIN CONTENT
========================= */

.main {

    margin-left: 230px;

    min-height: 100vh;
}

.container {

    max-width: 1100px;

    margin: auto;

    padding:
        50px
        30px
        40px;
}


/* =========================
   HEADER
========================= */

.header {

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    margin-bottom: 30px;

    gap: 20px;
}

.header h1 {

    margin: 0;

    font-size: 32px;

    letter-spacing: -1px;
}

.header p {

    color: #777;

    margin-top: 8px;
}

.back {

    text-decoration: none;

    color: #555;

    font-size: 14px;
}

.back:hover {

    color: #111;
}


/* =========================
   INFO
========================= */

.info {

    background: white;

    padding: 20px;

    border-radius: 16px;

    margin-bottom: 25px;

    color: #666;

    line-height: 1.5;

    border:
        1px solid #e8e8e8;
}

.info h2 {

    margin-top: 0;

    color: #111;

    margin-bottom: 15px;
}


/* =========================
   EXPERIMENT
========================= */

.variant {

    background: white;

    border-radius: 16px;

    padding: 24px;

    margin-bottom: 15px;

    border:
        1px solid #e8e8e8;
}

.top {

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    margin-bottom: 15px;

    gap: 20px;
}

.label {

    font-size: 13px;

    font-weight: bold;

    color: #777;
}

.rate {

    font-size: 28px;

    font-weight: bold;
}

.message {

    font-size: 17px;

    margin-bottom: 20px;

    line-height: 1.5;

    word-break: break-word;
}

.stats {

    display: flex;

    gap: 30px;

    color: #666;

    font-size: 14px;

    flex-wrap: wrap;
}

.empty {

    background: white;

    padding: 30px;

    border-radius: 16px;

    color: #777;

    border:
        1px solid #e8e8e8;
}


/* =========================
   FORM
========================= */

.form-input,
.form-textarea {

    width: 100%;

    padding: 12px;

    margin: 10px 0;

    border:
        1px solid #ddd;

    border-radius: 10px;

    font-family:
        Arial,
        sans-serif;

    font-size: 15px;

    outline: none;
}

.form-input:focus,
.form-textarea:focus {

    border-color: #999;
}

.form-textarea {

    min-height: 90px;

    resize: vertical;
}

.create-button {

    padding:
        12px
        18px;

    border: 0;

    border-radius: 10px;

    background: #111;

    color: white;

    cursor: pointer;

    font-size: 14px;

    font-weight: 600;
}

.create-button:hover {

    opacity: 0.85;
}

.result {

    margin-top: 15px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 800px) {

    .main {

        margin-left: 0;

    }


    .container {

        padding:
            30px
            15px
            30px;

    }


    .header {

        align-items:
            flex-start;

        flex-direction:
            column;

    }


    .header h1 {

        font-size: 28px;

    }


    .back {

        display: none;

    }

}


@media (max-width: 500px) {

    .stats {

        flex-direction:
            column;

        gap: 8px;

    }


    .variant {

        padding: 18px;

    }

}

</style>

</head>


<body>


<!-- =========================
     SHARED NAVIGATION
========================= -->

<div id="appNav"></div>


<!-- =========================
     MAIN
========================= -->

<main class="main">

<div class="container">


    <!-- Header -->

    <div class="header">

        <div>

            <h1>
                Experiments
            </h1>

            <p>
                Compare DM message performance
            </p>

        </div>


        <a
            href="index.html"
            class="back"
        >
            ← Dashboard
        </a>

    </div>


    <!-- Explanation -->

    <div class="info">

        Creator OS compares message variants
        using actual conversation performance.

        Use this page to identify messages
        worth testing and improving.

    </div>


    <!-- Create Experiment -->

    <div class="info">

        <h2>
            Create Experiment
        </h2>


        <input
            id="experimentName"
            class="form-input"
            type="text"
            placeholder="Experiment name"
        >


        <textarea
            id="variantA"
            class="form-textarea"
            placeholder="Variant A message"
        ></textarea>


        <textarea
            id="variantB"
            class="form-textarea"
            placeholder="Variant B message"
        ></textarea>


        <button
            id="createExperiment"
            class="create-button"
        >
            Create Experiment
        </button>


        <div
            id="experimentResult"
            class="result"
        ></div>

    </div>


    <!-- Experiment Results -->

    <div id="variants">

        <div class="empty">

            Loading experiments...

        </div>

    </div>


</div>

</main>


<!-- =========================
     CONFIG + NAV
========================= -->

<script src="config.js"></script>

<script src="nav.js"></script>


<script>

/* =========================
   LOAD EXPERIMENTS
========================= */

async function loadExperiments() {

    const container =
        document.getElementById(
            "variants"
        );


    try {

        const response =
            await fetch(
                `${API_URL}/api/experiments/list`
            );


        if (!response.ok) {

            throw new Error(
                "Failed to load experiments"
            );

        }


        const data =
            await response.json();


        const variants =
            data.variants || [];


        if (!variants.length) {

            container.innerHTML = `

                <div class="empty">

                    No experiment data available yet.
                    Import conversation data first.

                </div>

            `;

            return;

        }


        container.innerHTML = "";


        variants.forEach(
            variant => {

                const element =
                    document.createElement(
                        "div"
                    );


                element.className =
                    "variant";


                element.innerHTML = `

                    <div class="top">

                        <div class="label">

                            Variant
                            ${escapeHtml(
                                variant.variant
                            )}

                        </div>


                        <div class="rate">

                            ${variant.reply_rate_percent}%

                        </div>

                    </div>


                    <div class="message">

                        "${escapeHtml(
                            variant.message
                        )}"

                    </div>


                    <div class="stats">

                        <span>

                            Sent:
                            ${variant.sent}

                        </span>


                        <span>

                            Replies:
                            ${variant.replies}

                        </span>


                        <span>

                            Avg Response:
                            ${formatTime(
                                variant.average_response_seconds
                            )}

                        </span>

                    </div>

                `;


                container.appendChild(
                    element
                );

            }
        );


    } catch (error) {

        container.innerHTML = `

            <div class="empty">

                Could not connect to
                Creator OS API.

            </div>

        `;

        console.error(error);

    }

}


/* =========================
   FORMAT TIME
========================= */

function formatTime(seconds) {

    if (
        seconds === null ||
        seconds === undefined
    ) {

        return "N/A";

    }


    if (seconds < 60) {

        return (
            Math.round(seconds) +
            "s"
        );

    }


    const minutes =
        Math.floor(
            seconds / 60
        );


    const remaining =
        Math.round(
            seconds % 60
        );


    return `${minutes}m ${remaining}s`;

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value) {

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =========================
   CREATE EXPERIMENT
========================= */

document
    .getElementById(
        "createExperiment"
    )
    .addEventListener(
        "click",
        createExperiment
    );


async function createExperiment() {

    const name =
        document
            .getElementById(
                "experimentName"
            )
            .value
            .trim();


    const variantA =
        document
            .getElementById(
                "variantA"
            )
            .value
            .trim();


    const variantB =
        document
            .getElementById(
                "variantB"
            )
            .value
            .trim();


    const result =
        document.getElementById(
            "experimentResult"
        );


    /* Validation */

    if (
        !name ||
        !variantA ||
        !variantB
    ) {

        result.innerHTML = `

            <p>
                Please complete all fields.
            </p>

        `;

        return;

    }


    try {

        const response =
            await fetch(
                `${API_URL}/api/experiments`,
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body: JSON.stringify({

                        name:
                            name,

                        variant_a:
                            variantA,

                        variant_b:
                            variantB

                    })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.detail ||
                "Could not create experiment"
            );

        }


        result.innerHTML = `

            <p>
                Experiment created successfully.
            </p>

        `;


        /* Clear form */

        document
            .getElementById(
                "experimentName"
            )
            .value = "";


        document
            .getElementById(
                "variantA"
            )
            .value = "";


        document
            .getElementById(
                "variantB"
            )
            .value = "";


        /* Refresh */

        loadExperiments();


    } catch (error) {

        result.innerHTML = `

            <p>

                ${escapeHtml(
                    error.message
                )}

            </p>

        `;

    }

}


/* =========================
   INITIAL LOAD
========================= */

loadExperiments();

</script>


</body>

</html>
