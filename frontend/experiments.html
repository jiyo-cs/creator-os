<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Experiments — Creator OS</title>

    <script src="config.js"></script>
    <script src="nav.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Inter",
                "Segoe UI", sans-serif;
            background: #f7f7f8;
            color: #111;
        }

        .main {
            margin-left: 230px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 50px 30px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 20px;
            margin-bottom: 35px;
        }

        .eyebrow {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #777;
            margin-bottom: 8px;
        }

        h1 {
            margin: 0;
            font-size: 34px;
            letter-spacing: -1px;
        }

        .subtitle {
            margin-top: 8px;
            color: #777;
            font-size: 14px;
        }

        .create-button {
            border: 0;
            background: #111;
            color: white;
            padding: 12px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .create-button:hover {
            background: #222;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat {
            background: white;
            border: 1px solid #e7e7e7;
            border-radius: 14px;
            padding: 20px;
        }

        .stat-label {
            color: #777;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 27px;
            font-weight: 700;
        }

        .card {
            background: white;
            border: 1px solid #e7e7e7;
            border-radius: 16px;
            overflow: hidden;
        }

        .card-header {
            padding: 20px;
            border-bottom: 1px solid #eee;
        }

        .card-header h2 {
            margin: 0;
            font-size: 17px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th {
            text-align: left;
            padding: 14px 18px;
            font-size: 12px;
            color: #777;
            font-weight: 600;
            border-bottom: 1px solid #eee;
        }

        td {
            padding: 17px 18px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .experiment-name {
            font-weight: 600;
        }

        .variant {
            max-width: 180px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badge {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
        }

        .running {
            background: #eaf7ee;
            color: #20733b;
        }

        .draft {
            background: #f1f1f1;
            color: #666;
        }

        .view-button {
            border: 1px solid #ddd;
            background: white;
            padding: 7px 11px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
        }

        .view-button:hover {
            background: #f5f5f5;
        }

        .empty {
            padding: 60px 20px;
            text-align: center;
            color: #777;
        }

        .loading {
            padding: 40px;
            text-align: center;
            color: #777;
        }

        .error {
            margin-bottom: 20px;
            padding: 14px;
            background: #fff0f0;
            border: 1px solid #ffd5d5;
            color: #a33;
            border-radius: 10px;
            display: none;
        }

        /* Modal */

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 2000;
        }

        .modal {
            width: 100%;
            max-width: 700px;
            max-height: 90vh;
            overflow-y: auto;
            background: white;
            border-radius: 18px;
            padding: 28px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 25px;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 22px;
        }

        .close {
            border: 0;
            background: #f2f2f2;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
        }

        .variants {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .variant-card {
            border: 1px solid #e5e5e5;
            border-radius: 13px;
            padding: 18px;
        }

        .variant-title {
            font-weight: 700;
            margin-bottom: 12px;
        }

        .variant-text {
            color: #555;
            font-size: 14px;
            line-height: 1.5;
        }

        .result-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .result {
            border: 1px solid #e7e7e7;
            border-radius: 13px;
            padding: 18px;
        }

        .result h3 {
            margin: 0 0 15px;
            font-size: 14px;
        }

        .metric {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-size: 13px;
        }

        .metric strong {
            font-size: 14px;
        }

        @media (max-width: 900px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 800px) {
            .main {
                margin-left: 0;
            }

            .container {
                padding: 30px 15px;
            }

            .header {
                align-items: flex-start;
                flex-direction: column;
            }

            h1 {
                font-size: 28px;
            }
        }

        @media (max-width: 550px) {
            .stats {
                grid-template-columns: 1fr;
            }

            .variants,
            .result-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div id="appNav"></div>

    <main class="main">

        <div class="container">

            <div class="header">

                <div>
                    <div class="eyebrow">Optimization</div>

                    <h1>Experiments</h1>

                    <div class="subtitle">
                        Compare message variants and measure subscriber responses.
                    </div>
                </div>

                <button
                    class="create-button"
                    onclick="openCreateModal()"
                >
                    + New Experiment
                </button>

            </div>

            <div id="error" class="error"></div>

            <section class="stats">

                <div class="stat">
                    <div class="stat-label">
                        Total Experiments
                    </div>

                    <div
                        class="stat-value"
                        id="totalExperiments"
                    >
                        0
                    </div>
                </div>

                <div class="stat">
                    <div class="stat-label">
                        Running
                    </div>

                    <div
                        class="stat-value"
                        id="runningExperiments"
                    >
                        0
                    </div>
                </div>

                <div class="stat">
                    <div class="stat-label">
                        Total Exposures
                    </div>

                    <div
                        class="stat-value"
                        id="totalExposures"
                    >
                        0
                    </div>
                </div>

                <div class="stat">
                    <div class="stat-label">
                        Total Replies
                    </div>

                    <div
                        class="stat-value"
                        id="totalReplies"
                    >
                        0
                    </div>
                </div>

            </section>

            <section class="card">

                <div class="card-header">
                    <h2>All Experiments</h2>
                </div>

                <div
                    id="loading"
                    class="loading"
                >
                    Loading experiments...
                </div>

                <div
                    id="empty"
                    class="empty"
                    style="display:none;"
                >
                    No experiments created yet.
                </div>

                <div
                    class="table-wrapper"
                    id="tableWrapper"
                    style="display:none;"
                >

                    <table>

                        <thead>

                            <tr>
                                <th>Experiment</th>
                                <th>Variant A</th>
                                <th>Variant B</th>
                                <th>Status</th>
                                <th>Created</th>
                                <th></th>
                            </tr>

                        </thead>

                        <tbody id="experimentsTable"></tbody>

                    </table>

                </div>

            </section>

        </div>

    </main>


    <!-- Details Modal -->

    <div
        id="detailsModal"
        class="modal-overlay"
        onclick="closeDetails(event)"
    >

        <div
            class="modal"
            onclick="event.stopPropagation()"
        >

            <div class="modal-header">

                <h2 id="detailsTitle">
                    Experiment
                </h2>

                <button
                    class="close"
                    onclick="closeDetails()"
                >
                    ×
                </button>

            </div>

            <div
                class="variants"
                id="detailsVariants"
            ></div>

            <div
                class="result-grid"
                id="detailsResults"
            ></div>

        </div>

    </div>


    <!-- Create Modal -->

    <div
        id="createModal"
        class="modal-overlay"
        onclick="closeCreateModal(event)"
    >

        <div
            class="modal"
            onclick="event.stopPropagation()"
        >

            <div class="modal-header">

                <h2>New Experiment</h2>

                <button
                    class="close"
                    onclick="closeCreateModal()"
                >
                    ×
                </button>

            </div>

            <form id="createForm">

                <label>
                    Experiment name
                </label>

                <input
                    id="experimentName"
                    required
                    placeholder="Welcome Message Test"
                    style="
                        width:100%;
                        margin:8px 0 18px;
                        padding:12px;
                        border:1px solid #ddd;
                        border-radius:9px;
                    "
                >

                <label>
                    Variant A
                </label>

                <textarea
                    id="variantA"
                    required
                    placeholder="Message version A"
                    style="
                        width:100%;
                        min-height:100px;
                        margin:8px 0 18px;
                        padding:12px;
                        border:1px solid #ddd;
                        border-radius:9px;
                        resize:vertical;
                        font-family:inherit;
                    "
                ></textarea>

                <label>
                    Variant B
                </label>

                <textarea
                    id="variantB"
                    required
                    placeholder="Message version B"
                    style="
                        width:100%;
                        min-height:100px;
                        margin:8px 0 20px;
                        padding:12px;
                        border:1px solid #ddd;
                        border-radius:9px;
                        resize:vertical;
                        font-family:inherit;
                    "
                ></textarea>

                <button
                    type="submit"
                    class="create-button"
                    style="width:100%;"
                >
                    Create Experiment
                </button>

            </form>

        </div>

    </div>


<script>

let experiments = [];


async function loadExperiments() {

    const loading =
        document.getElementById("loading");

    const empty =
        document.getElementById("empty");

    const tableWrapper =
        document.getElementById("tableWrapper");

    const error =
        document.getElementById("error");

    try {

        loading.style.display = "block";
        empty.style.display = "none";
        tableWrapper.style.display = "none";
        error.style.display = "none";

        const response =
            await fetch(
                `${API_URL}/api/experiments/list`
            );

        if (!response.ok) {
            throw new Error(
                "Failed to load experiments"
            );
        }

        const data =
            await response.json();

        experiments =
            data.experiments || [];

        updateStats();

        loading.style.display = "none";

        if (experiments.length === 0) {

            empty.style.display = "block";

            return;
        }

        renderExperiments();

        tableWrapper.style.display = "block";

    } catch (err) {

        loading.style.display = "none";

        error.style.display = "block";

        error.textContent =
            err.message;

    }
}


function updateStats() {

    document.getElementById(
        "totalExperiments"
    ).textContent =
        experiments.length;

    document.getElementById(
        "runningExperiments"
    ).textContent =
        experiments.filter(
            e => e.status === "running"
        ).length;

    let exposures = 0;
    let replies = 0;

    experiments.forEach(e => {

        if (e.results) {

            e.results.forEach(r => {

                exposures +=
                    Number(r.sent || 0);

                replies +=
                    Number(r.replies || 0);

            });

        }

    });

    document.getElementById(
        "totalExposures"
    ).textContent =
        exposures;

    document.getElementById(
        "totalReplies"
    ).textContent =
        replies;
}


function renderExperiments() {

    const tbody =
        document.getElementById(
            "experimentsTable"
        );

    tbody.innerHTML = "";

    experiments.forEach(experiment => {

        const row =
            document.createElement("tr");

        const created =
            experiment.created_at
                ? new Date(
                    experiment.created_at
                ).toLocaleDateString()
                : "—";

        row.innerHTML = `

            <td>
                <div class="experiment-name">
                    ${escapeHtml(
                        experiment.name
                    )}
                </div>
            </td>

            <td>
                <div class="variant">
                    ${escapeHtml(
                        experiment.variant_a
                    )}
                </div>
            </td>

            <td>
                <div class="variant">
                    ${escapeHtml(
                        experiment.variant_b
                    )}
                </div>
            </td>

            <td>
                <span class="badge ${experiment.status}">
                    ${escapeHtml(
                        experiment.status
                    )}
                </span>
            </td>

            <td>
                ${created}
            </td>

            <td>
                <button
                    class="view-button"
                    onclick="viewExperiment(
                        ${experiment.id}
                    )"
                >
                    View
                </button>
            </td>

        `;

        tbody.appendChild(row);

    });
}


async function viewExperiment(id) {

    try {

        const response =
            await fetch(
                `${API_URL}/api/experiments/${id}`
            );

        if (!response.ok) {
            throw new Error(
                "Failed to load experiment"
            );
        }

        const experiment =
            await response.json();

        document.getElementById(
            "detailsTitle"
        ).textContent =
            experiment.name;

        document.getElementById(
            "detailsVariants"
        ).innerHTML = `

            <div class="variant-card">

                <div class="variant-title">
                    Variant A
                </div>

                <div class="variant-text">
                    ${escapeHtml(
                        experiment.variant_a
                    )}
                </div>

            </div>

            <div class="variant-card">

                <div class="variant-title">
                    Variant B
                </div>

                <div class="variant-text">
                    ${escapeHtml(
                        experiment.variant_b
                    )}
                </div>

            </div>

        `;

        const results =
            experiment.results || [];

        document.getElementById(
            "detailsResults"
        ).innerHTML =
            results.map(result => `

                <div class="result">

                    <h3>
                        Variant ${result.variant}
                    </h3>

                    <div class="metric">
                        <span>Exposures</span>
                        <strong>
                            ${result.sent || 0}
                        </strong>
                    </div>

                    <div class="metric">
                        <span>Replies</span>
                        <strong>
                            ${result.replies || 0}
                        </strong>
                    </div>

                    <div class="metric">
                        <span>Reply Rate</span>
                        <strong>
                            ${result.reply_rate_percent || 0}%
                        </strong>
                    </div>

                </div>

            `).join("");

        document.getElementById(
            "detailsModal"
        ).style.display =
            "flex";

    } catch (err) {

        alert(err.message);

    }

}


function openCreateModal() {

    document.getElementById(
        "createModal"
    ).style.display =
        "flex";

}


function closeCreateModal(event) {

    if (
        event &&
        event.target !==
        document.getElementById("createModal")
    ) {
        return;
    }

    document.getElementById(
        "createModal"
    ).style.display =
        "none";

}


function closeDetails(event) {

    if (
        event &&
        event.target !==
        document.getElementById("detailsModal")
    ) {
        return;
    }

    document.getElementById(
        "detailsModal"
    ).style.display =
        "none";

}


document.getElementById(
    "createForm"
).addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const name =
            document.getElementById(
                "experimentName"
            ).value.trim();

        const variantA =
            document.getElementById(
                "variantA"
            ).value.trim();

        const variantB =
            document.getElementById(
                "variantB"
            ).value.trim();

        try {

            const response =
                await fetch(
                    `${API_URL}/api/experiments`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            name: name,
                            variant_a: variantA,
                            variant_b: variantB
                        })
                    }
                );

            if (!response.ok) {

                const data =
                    await response.json();

                throw new Error(
                    data.detail ||
                    "Failed to create experiment"
                );

            }

            document.getElementById(
                "createForm"
            ).reset();

            closeCreateModal();

            await loadExperiments();

        } catch (err) {

            alert(err.message);

        }

    }
);


function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


loadExperiments();

</script>

</body>
</html>
