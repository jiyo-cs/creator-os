<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Experiments — Creator OS</title>

    <script src="config.js"></script>
    <script src="nav.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            background: #f6f6f4;
            color: #111;
        }

        .main {
            margin-left: 230px;
            min-height: 100vh;
        }

        .container {
            max-width: 1250px;
            margin: auto;
            padding: 48px 32px 60px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 32px;
        }

        .eyebrow {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 8px;
        }

        h1 {
            margin: 0;
            font-size: 34px;
            letter-spacing: -1px;
        }

        .subtitle {
            margin-top: 8px;
            color: #777;
            font-size: 15px;
        }

        button {
            border: 0;
            cursor: pointer;
            font: inherit;
        }

        .primary-button {
            background: #111;
            color: white;
            padding: 12px 18px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
        }

        .primary-button:hover {
            background: #2a2a2a;
        }

        /* =========================
           STATS
        ========================= */

        .stats {
            display: grid;
            grid-template-columns:
                repeat(4, 1fr);
            gap: 14px;
            margin-bottom: 28px;
        }

        .stat-card {
            background: white;
            border: 1px solid #e5e5e2;
            border-radius: 14px;
            padding: 20px;
        }

        .stat-label {
            color: #888;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 27px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        /* =========================
           TABLE
        ========================= */

        .panel {
            background: white;
            border: 1px solid #e5e5e2;
            border-radius: 16px;
            overflow: hidden;
        }

        .panel-header {
            padding: 20px 22px;
            border-bottom: 1px solid #e9e9e7;
        }

        .panel-title {
            font-size: 16px;
            font-weight: 700;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th {
            text-align: left;
            padding: 13px 20px;
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: .7px;
            background: #fafafa;
        }

        td {
            padding: 17px 20px;
            border-top: 1px solid #eeeeec;
            font-size: 14px;
        }

        .experiment-name {
            font-weight: 650;
        }

        .variant-text {
            max-width: 210px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #555;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 9px;
            border-radius: 999px;
            background: #f0f0ee;
            font-size: 12px;
            font-weight: 600;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #111;
        }

        .view-button {
            background: #f1f1ef;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
        }

        .view-button:hover {
            background: #e5e5e2;
        }

        .empty {
            padding: 60px 20px;
            text-align: center;
            color: #888;
        }

        /* =========================
           MODAL
        ========================= */

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.48);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 2000;
        }

        .modal.open {
            display: flex;
        }

        .modal-card {
            width: min(950px, 100%);
            max-height: 92vh;
            overflow-y: auto;
            background: white;
            border-radius: 18px;
            padding: 28px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 24px;
        }

        .modal-title {
            font-size: 24px;
            font-weight: 750;
            letter-spacing: -.5px;
        }

        .close-button {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #f0f0ee;
            font-size: 20px;
        }

        /* =========================
           INTELLIGENCE
        ========================= */

        .intelligence {
            border: 1px solid #e5e5e2;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .section-label {
            font-size: 11px;
            font-weight: 750;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 15px;
        }

        .intelligence-grid {
            display: grid;
            grid-template-columns:
                repeat(4, 1fr);
            gap: 12px;
        }

        .intel-card {
            background: #f7f7f5;
            border-radius: 11px;
            padding: 15px;
        }

        .intel-label {
            font-size: 12px;
            color: #777;
            margin-bottom: 7px;
        }

        .intel-value {
            font-size: 19px;
            font-weight: 700;
        }

        .quality {
            margin-top: 18px;
        }

        .quality-top {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 7px;
        }

        .quality-bar {
            height: 8px;
            background: #e8e8e5;
            border-radius: 999px;
            overflow: hidden;
        }

        .quality-fill {
            height: 100%;
            width: 0;
            background: #111;
            border-radius: inherit;
            transition: width .4s ease;
        }

        .recommendation {
            margin-top: 18px;
            padding: 16px;
            border-radius: 11px;
            background: #f4f4f2;
            font-size: 14px;
            line-height: 1.5;
        }

        /* =========================
           VARIANT CARDS
        ========================= */

        .variants {
            display: grid;
            grid-template-columns:
                repeat(2, 1fr);
            gap: 14px;
            margin-bottom: 24px;
        }

        .variant-card {
            border: 1px solid #e5e5e2;
            border-radius: 14px;
            padding: 20px;
        }

        .variant-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .variant-name {
            font-size: 13px;
            font-weight: 750;
        }

        .variant-badge {
            background: #f0f0ee;
            padding: 5px 8px;
            border-radius: 7px;
            font-size: 11px;
            font-weight: 700;
        }

        .message-box {
            background: #f7f7f5;
            padding: 14px;
            border-radius: 10px;
            line-height: 1.5;
            font-size: 14px;
            margin-bottom: 16px;
            min-height: 65px;
        }

        .metrics {
            display: grid;
            grid-template-columns:
                repeat(2, 1fr);
            gap: 10px;
        }

        .metric {
            border-top: 1px solid #ececea;
            padding-top: 10px;
        }

        .metric-label {
            font-size: 11px;
            color: #888;
            margin-bottom: 4px;
        }

        .metric-value {
            font-size: 17px;
            font-weight: 700;
        }

        /* =========================
           CREATE
        ========================= */

        .form-group {
            margin-bottom: 17px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 650;
            margin-bottom: 7px;
        }

        input,
        textarea {
            width: 100%;
            border: 1px solid #ddd;
            border-radius: 9px;
            padding: 11px 12px;
            font: inherit;
            outline: none;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            border-color: #999;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .secondary-button {
            background: #f0f0ee;
            padding: 11px 16px;
            border-radius: 9px;
            font-size: 14px;
            font-weight: 600;
        }

        .loading {
            padding: 40px;
            text-align: center;
            color: #888;
        }

        .error {
            padding: 20px;
            color: #a00;
            background: #fff2f2;
            border-radius: 10px;
            margin: 20px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 900px) {

            .stats {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .intelligence-grid {
                grid-template-columns:
                    repeat(2, 1fr);
            }

        }

        @media (max-width: 800px) {

            .main {
                margin-left: 0;
            }

            .container {
                padding: 30px 15px 45px;
            }

            .header {
                flex-direction: column;
            }

            h1 {
                font-size: 29px;
            }

            .variants {
                grid-template-columns: 1fr;
            }

            .modal-card {
                padding: 20px;
                border-radius: 14px;
            }

        }

        @media (max-width: 500px) {

            .stats {
                grid-template-columns: 1fr;
            }

            .intelligence-grid {
                grid-template-columns: 1fr 1fr;
            }

            .stat-value {
                font-size: 24px;
            }

        }

    </style>

</head>

<body>

    <div id="appNav"></div>

    <main class="main">

        <div class="container">

            <header class="header">

                <div>

                    <div class="eyebrow">
                        Experiment Intelligence
                    </div>

                    <h1>A/B Experiments</h1>

                    <div class="subtitle">
                        Measure message performance and optimize DM sequences.
                    </div>

                </div>

                <button
                    class="primary-button"
                    onclick="openCreateModal()"
                >
                    + New Experiment
                </button>

            </header>


            <!-- =========================
                 STATS
            ========================= -->

            <section class="stats">

                <div class="stat-card">

                    <div class="stat-label">
                        Total Experiments
                    </div>

                    <div
                        class="stat-value"
                        id="totalExperiments"
                    >
                        —
                    </div>

                </div>

                <div class="stat-card">

                    <div class="stat-label">
                        Running
                    </div>

                    <div
                        class="stat-value"
                        id="runningExperiments"
                    >
                        —
                    </div>

                </div>

                <div class="stat-card">

                    <div class="stat-label">
                        Total Exposures
                    </div>

                    <div
                        class="stat-value"
                        id="totalExposures"
                    >
                        —
                    </div>

                </div>

                <div class="stat-card">

                    <div class="stat-label">
                        Total Replies
                    </div>

                    <div
                        class="stat-value"
                        id="totalReplies"
                    >
                        —
                    </div>

                </div>

            </section>


            <!-- =========================
                 EXPERIMENT LIST
            ========================= -->

            <section class="panel">

                <div class="panel-header">

                    <div class="panel-title">
                        Experiments
                    </div>

                </div>

                <div id="experimentContent">

                    <div class="loading">
                        Loading experiments...
                    </div>

                </div>

            </section>

        </div>

    </main>


    <!-- =========================
         VIEW MODAL
    ========================= -->

    <div
        class="modal"
        id="viewModal"
    >

        <div class="modal-card">

            <div class="modal-header">

                <div>
                    <div class="eyebrow">
                        Experiment Analysis
                    </div>

                    <div
                        class="modal-title"
                        id="viewTitle"
                    >
                        Experiment
                    </div>
                </div>

                <button
                    class="close-button"
                    onclick="closeModal('viewModal')"
                >
                    ×
                </button>

            </div>

            <div id="viewContent"></div>

        </div>

    </div>


    <!-- =========================
         CREATE MODAL
    ========================= -->

    <div
        class="modal"
        id="createModal"
    >

        <div class="modal-card">

            <div class="modal-header">

                <div>

                    <div class="eyebrow">
                        New Experiment
                    </div>

                    <div class="modal-title">
                        Create A/B Test
                    </div>

                </div>

                <button
                    class="close-button"
                    onclick="closeModal('createModal')"
                >
                    ×
                </button>

            </div>


            <div class="form-group">

                <label class="form-label">
                    Experiment name
                </label>

                <input
                    id="experimentName"
                    placeholder="Welcome Message Test"
                >

            </div>


            <div class="form-group">

                <label class="form-label">
                    Variant A
                </label>

                <textarea
                    id="variantA"
                    placeholder="Enter message A..."
                ></textarea>

            </div>


            <div class="form-group">

                <label class="form-label">
                    Variant B
                </label>

                <textarea
                    id="variantB"
                    placeholder="Enter message B..."
                ></textarea>

            </div>


            <div class="form-actions">

                <button
                    class="secondary-button"
                    onclick="closeModal('createModal')"
                >
                    Cancel
                </button>

                <button
                    class="primary-button"
                    onclick="createExperiment()"
                >
                    Create Experiment
                </button>

            </div>

        </div>

    </div>


<script>

    const API =
        typeof API_URL !== "undefined"
            ? API_URL
            : "";


    // =====================================================
    // LOAD EXPERIMENTS
    // =====================================================

    async function loadExperiments() {

        const container =
            document.getElementById(
                "experimentContent"
            );

        try {

            const response =
                await fetch(
                    `${API}/api/experiments/list`
                );

            if (!response.ok) {

                throw new Error(
                    "Failed to load experiments"
                );

            }

            const data =
                await response.json();

            const experiments =
                data.experiments || [];

            updateStats(
                experiments
            );

            if (!experiments.length) {

                container.innerHTML = `
                    <div class="empty">
                        No experiments yet.
                        Create your first A/B test.
                    </div>
                `;

                return;
            }

            container.innerHTML = `
                <div class="table-wrap">

                    <table>

                        <thead>

                            <tr>

                                <th>
                                    Experiment
                                </th>

                                <th>
                                    Variant A
                                </th>

                                <th>
                                    Variant B
                                </th>

                                <th>
                                    Status
                                </th>

                                <th>
                                    Created
                                </th>

                                <th>
                                    Action
                                </th>

                            </tr>

                        </thead>

                        <tbody>

                            ${experiments
                                .map(experimentRow)
                                .join("")}

                        </tbody>

                    </table>

                </div>
            `;

        } catch (error) {

            container.innerHTML = `
                <div class="error">
                    ${escapeHtml(
                        error.message
                    )}
                </div>
            `;

        }

    }


    // =====================================================
    // STATS
    // =====================================================

    async function updateStats(
        experiments
    ) {

        document.getElementById(
            "totalExperiments"
        ).textContent =
            experiments.length;

        document.getElementById(
            "runningExperiments"
        ).textContent =
            experiments.filter(
                item =>
                    item.status === "running"
            ).length;

        let exposures = 0;
        let replies = 0;

        for (
            const experiment
            of experiments
        ) {

            try {

                const response =
                    await fetch(
                        `${API}/api/experiments/${experiment.id}`
                    );

                if (!response.ok) {
                    continue;
                }

                const data =
                    await response.json();

                for (
                    const result
                    of (data.results || [])
                ) {

                    exposures +=
                        Number(
                            result.sent || 0
                        );

                    replies +=
                        Number(
                            result.replies || 0
                        );

                }

            } catch {

                continue;

            }

        }

        document.getElementById(
            "totalExposures"
        ).textContent =
            exposures;

        document.getElementById(
            "totalReplies"
        ).textContent =
            replies;

    }


    // =====================================================
    // TABLE ROW
    // =====================================================

    function experimentRow(
        experiment
    ) {

        const created =
            experiment.created_at
                ? new Date(
                    experiment.created_at
                ).toLocaleDateString()
                : "—";

        return `
            <tr>

                <td>
                    <div class="experiment-name">
                        ${escapeHtml(
                            experiment.name
                        )}
                    </div>
                </td>

                <td>

                    <div class="variant-text">
                        ${escapeHtml(
                            experiment.variant_a
                        )}
                    </div>

                </td>

                <td>

                    <div class="variant-text">
                        ${escapeHtml(
                            experiment.variant_b
                        )}
                    </div>

                </td>

                <td>

                    <span class="status">

                        <span class="status-dot"></span>

                        ${escapeHtml(
                            experiment.status
                        )}

                    </span>

                </td>

                <td>
                    ${created}
                </td>

                <td>

                    <button
                        class="view-button"
                        onclick="viewExperiment(${experiment.id})"
                    >
                        View
                    </button>

                </td>

            </tr>
        `;

    }


    // =====================================================
    // VIEW EXPERIMENT
    // =====================================================

    async function viewExperiment(
        id
    ) {

        const modal =
            document.getElementById(
                "viewModal"
            );

        const content =
            document.getElementById(
                "viewContent"
            );

        content.innerHTML = `
            <div class="loading">
                Loading analysis...
            </div>
        `;

        modal.classList.add("open");

        try {

            const response =
                await fetch(
                    `${API}/api/experiments/${id}`
                );

            if (!response.ok) {

                throw new Error(
                    "Failed to load experiment"
                );

            }

            const data =
                await response.json();

            document.getElementById(
                "viewTitle"
            ).textContent =
                data.name;

            renderExperiment(
                data
            );

        } catch (error) {

            content.innerHTML = `
                <div class="error">
                    ${escapeHtml(
                        error.message
                    )}
                </div>
            `;

        }

    }


    // =====================================================
    // RENDER EXPERIMENT
    // =====================================================

    function renderExperiment(
        data
    ) {

        const results =
            data.results || [];

        const intelligence =
            data.intelligence || {};

        const variantA =
            results.find(
                item =>
                    item.variant === "A"
            ) || {};

        const variantB =
            results.find(
                item =>
                    item.variant === "B"
            ) || {};

        const quality =
            Number(
                intelligence.data_quality_percent || 0
            );

        const difference =
            Number(
                intelligence.reply_rate_difference || 0
            );

        const differenceText =
            difference > 0
                ? `+${difference} pp`
                : `${difference} pp`;

        document.getElementById(
            "viewContent"
        ).innerHTML = `

            <!-- INTELLIGENCE -->

            <section class="intelligence">

                <div class="section-label">
                    Experiment Intelligence
                </div>

                <div class="intelligence-grid">

                    <div class="intel-card">

                        <div class="intel-label">
                            Total Exposures
                        </div>

                        <div class="intel-value">
                            ${intelligence.total_exposures ?? 0}
                        </div>

                    </div>

                    <div class="intel-card">

                        <div class="intel-label">
                            Total Replies
                        </div>

                        <div class="intel-value">
                            ${intelligence.total_replies ?? 0}
                        </div>

                    </div>

                    <div class="intel-card">

                        <div class="intel-label">
                            Rate Difference
                        </div>

                        <div class="intel-value">
                            ${differenceText}
                        </div>

                    </div>

                    <div class="intel-card">

                        <div class="intel-label">
                            Minimum Sample
                        </div>

                        <div class="intel-value">
                            ${intelligence.minimum_recommended_sample ?? 30}
                        </div>

                    </div>

                </div>


                <div class="quality">

                    <div class="quality-top">

                        <span>
                            Data Quality
                        </span>

                        <strong>
                            ${quality}%
                        </strong>

                    </div>

                    <div class="quality-bar">

                        <div
                            class="quality-fill"
                            style="width:${Math.min(
                                quality,
                                100
                            )}%"
                        ></div>

                    </div>

                </div>


                <div class="recommendation">

                    <strong>
                        Recommendation
                    </strong>

                    <br>

                    ${escapeHtml(
                        intelligence.recommendation ||
                        "Collect more data."
                    )}

                </div>

            </section>


            <!-- VARIANTS -->

            <div class="section-label">
                Variant Performance
            </div>

            <section class="variants">

                ${renderVariant(
                    "A",
                    data.variant_a,
                    variantA
                )}

                ${renderVariant(
                    "B",
                    data.variant_b,
                    variantB
                )}

            </section>

        `;

    }


    // =====================================================
    // VARIANT
    // =====================================================

    function renderVariant(
        name,
        message,
        result
    ) {

        return `

            <div class="variant-card">

                <div class="variant-heading">

                    <div class="variant-name">
                        Variant ${name}
                    </div>

                    <div class="variant-badge">
                        ${result.reply_rate_percent ?? 0}% reply rate
                    </div>

                </div>


                <div class="message-box">

                    ${escapeHtml(
                        message || ""
                    )}

                </div>


                <div class="metrics">

                    <div class="metric">

                        <div class="metric-label">
                            Exposures
                        </div>

                        <div class="metric-value">
                            ${result.sent ?? 0}
                        </div>

                    </div>


                    <div class="metric">

                        <div class="metric-label">
                            Replies
                        </div>

                        <div class="metric-value">
                            ${result.replies ?? 0}
                        </div>

                    </div>


                    <div class="metric">

                        <div class="metric-label">
                            Drop-off
                        </div>

                        <div class="metric-value">
                            ${result.dropoff_rate_percent ?? 0}%
                        </div>

                    </div>


                    <div class="metric">

                        <div class="metric-label">
                            Avg Response
                        </div>

                        <div class="metric-value">
                            ${
                                result.average_response_time
                                || "N/A"
                            }
                        </div>

                    </div>

                </div>

            </div>

        `;

    }


    // =====================================================
    // CREATE MODAL
    // =====================================================

    function openCreateModal() {

        document
            .getElementById(
                "createModal"
            )
            .classList.add("open");

    }


    function closeModal(
        id
    ) {

        document
            .getElementById(id)
            .classList.remove("open");

    }


    // =====================================================
    // CREATE EXPERIMENT
    // =====================================================

    async function createExperiment() {

        const name =
            document
                .getElementById(
                    "experimentName"
                )
                .value
                .trim();

        const variantA =
            document
                .getElementById(
                    "variantA"
                )
                .value
                .trim();

        const variantB =
            document
                .getElementById(
                    "variantB"
                )
                .value
                .trim();

        if (
            !name ||
            !variantA ||
            !variantB
        ) {

            alert(
                "Please complete all fields."
            );

            return;

        }

        try {

            const response =
                await fetch(
                    `${API}/api/experiments`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            name:
                                name,

                            variant_a:
                                variantA,

                            variant_b:
                                variantB
                        })
                    }
                );

            if (!response.ok) {

                const error =
                    await response.json()
                        .catch(
                            () => ({})
                        );

                throw new Error(
                    error.detail ||
                    "Failed to create experiment"
                );

            }

            document
                .getElementById(
                    "experimentName"
                )
                .value = "";

            document
                .getElementById(
                    "variantA"
                )
                .value = "";

            document
                .getElementById(
                    "variantB"
                )
                .value = "";

            closeModal(
                "createModal"
            );

            await loadExperiments();

        } catch (error) {

            alert(
                error.message
            );

        }

    }


    // =====================================================
    // ESCAPE HTML
    // =====================================================

    function escapeHtml(
        value
    ) {

        return String(
            value ?? ""
        )
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

    }


    // =====================================================
    // MODAL CLICK OUTSIDE
    // =====================================================

    document
        .querySelectorAll(".modal")
        .forEach(
            modal => {

                modal.addEventListener(
                    "click",
                    event => {

                        if (
                            event.target ===
                            modal
                        ) {

                            modal.classList.remove(
                                "open"
                            );

                        }

                    }
                );

            }
        );


    // =====================================================
    // INITIAL LOAD
    // =====================================================

    loadExperiments();

</script>

</body>

</html>
