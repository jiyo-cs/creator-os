<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Creator OS — Login</title>

    <script src="config.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            color: #111;
        }

        .login {
            width: 100%;
            max-width: 390px;
            padding: 24px;
        }

        .brand {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand h1 {
            margin: 0 0 8px;
            font-size: 28px;
            letter-spacing: -1px;
        }

        .brand p {
            margin: 0;
            color: #777;
            font-size: 14px;
        }

        .card {
            background: white;
            border: 1px solid #e5e5e5;
            border-radius: 18px;
            padding: 28px;
            box-shadow:
                0 12px 40px
                rgba(0, 0, 0, 0.06);
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            margin-bottom: 18px;
        }

        input:focus {
            border-color: #111;
        }

        button {
            width: 100%;
            border: 0;
            border-radius: 10px;
            padding: 13px;
            background: #111;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
            cursor: wait;
        }

        .error {
            display: none;
            margin-bottom: 16px;
            padding: 11px;
            border-radius: 9px;
            background: #fff0f0;
            color: #b00020;
            font-size: 13px;
            line-height: 1.5;
            word-break: break-word;
        }

        .status {
            margin-top: 14px;
            padding: 10px;
            border-radius: 9px;
            background: #f5f5f5;
            color: #666;
            font-size: 12px;
            line-height: 1.5;
            display: none;
        }

        .status.visible {
            display: block;
        }

    </style>

</head>


<body>


<main class="login">


    <div class="brand">

        <h1>
            Creator OS
        </h1>

        <p>
            DM Analytics & Optimization
        </p>

    </div>


    <div class="card">


        <div
            id="error"
            class="error"
        ></div>


        <div
            id="status"
            class="status"
        ></div>


        <form id="loginForm">


            <label for="email">
                Email
            </label>


            <input
                id="email"
                type="email"
                autocomplete="username"
                required
            >


            <label for="password">
                Password
            </label>


            <input
                id="password"
                type="password"
                autocomplete="current-password"
                required
            >


            <button
                id="loginButton"
                type="submit"
            >
                Sign in
            </button>


        </form>


    </div>


</main>


<script>

"use strict";


/* =========================================================
   ELEMENTS
========================================================= */

const form =
    document.getElementById(
        "loginForm"
    );

const error =
    document.getElementById(
        "error"
    );

const statusBox =
    document.getElementById(
        "status"
    );

const button =
    document.getElementById(
        "loginButton"
    );

const emailInput =
    document.getElementById(
        "email"
    );

const passwordInput =
    document.getElementById(
        "password"
    );


/* =========================================================
   ERROR / STATUS
========================================================= */

function showError(message) {

    error.textContent =
        message;

    error.style.display =
        "block";
}


function hideError() {

    error.textContent =
        "";

    error.style.display =
        "none";
}


function showStatus(message) {

    statusBox.textContent =
        message;

    statusBox.classList.add(
        "visible"
    );
}


function hideStatus() {

    statusBox.textContent =
        "";

    statusBox.classList.remove(
        "visible"
    );
}


/* =========================================================
   NETWORK ERROR
========================================================= */

function explainNetworkError(error) {

    const message =
        error &&
        error.message
            ? error.message
            : String(error);


    if (
        message.toLowerCase()
            .includes("load failed")
    ) {

        return (
            "The browser could not complete the request to the Creator OS API. " +
            "This usually indicates a CORS, browser-network, or connection problem."
        );
    }


    if (
        message.toLowerCase()
            .includes("failed to fetch")
    ) {

        return (
            "The browser could not reach the Creator OS API. " +
            "Check CORS or the API connection."
        );
    }


    return message;
}


/* =========================================================
   API CONNECTIVITY TEST
========================================================= */

async function testApiConnection() {

    showStatus(
        "Checking Creator OS API..."
    );

    try {

        const response =
            await fetch(
                `${API_URL}/health`,
                {
                    method: "GET",
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                `API health check returned HTTP ${response.status}`
            );
        }


        const data =
            await response.json();


        if (
            data.status !== "ok"
        ) {

            throw new Error(
                "API responded, but health status was not OK."
            );
        }


        showStatus(
            "Creator OS API connected."
        );


        return true;


    } catch (error) {

        console.error(
            "API connectivity test failed:",
            error
        );


        showError(
            "API connection failed: " +
            explainNetworkError(error)
        );


        return false;
    }
}


/* =========================================================
   EXISTING SESSION
========================================================= */

async function checkExistingSession() {

    try {

        const response =
            await fetch(
                `${API_URL}/api/auth/me`,
                {
                    method: "GET",
                    credentials: "include",
                    cache: "no-store"
                }
            );


        /*
         * 200 means an existing session is valid.
         */

        if (response.ok) {

            window.location.replace(
                "index.html"
            );

            return true;
        }


        /*
         * 401 is completely normal
         * when the user is not logged in.
         */

        if (
            response.status === 401
        ) {

            hideStatus();

            return false;
        }


        throw new Error(
            `Session check returned HTTP ${response.status}`
        );


    } catch (error) {

        console.error(
            "Session check failed:",
            error
        );


        showError(
            "Session check failed: " +
            explainNetworkError(error)
        );


        return false;
    }
}


/* =========================================================
   LOGIN
========================================================= */

form.addEventListener(
    "submit",
    async (event) => {

        event.preventDefault();

        hideError();

        showStatus(
            "Signing in..."
        );

        button.disabled =
            true;

        button.textContent =
            "Signing in...";


        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;


        if (!email || !password) {

            showError(
                "Email and password are required."
            );

            button.disabled =
                false;

            button.textContent =
                "Sign in";

            return;
        }


        try {

            /* =================================================
               LOGIN REQUEST
            ================================================= */

            const response =
                await fetch(
                    `${API_URL}/api/auth/login`,
                    {
                        method: "POST",

                        credentials:
                            "include",

                        cache:
                            "no-store",

                        headers: {
                            "Content-Type":
                                "application/json",

                            "Accept":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                email:
                                    email,

                                password:
                                    password
                            })
                    }
                );


            let data = {};


            try {

                data =
                    await response.json();

            } catch (
                jsonError
            ) {

                console.warn(
                    "Could not parse login response:",
                    jsonError
                );
            }


            /* =================================================
               LOGIN FAILURE
            ================================================= */

            if (!response.ok) {

                if (
                    response.status === 401
                ) {

                    throw new Error(
                        "Invalid email or password."
                    );
                }


                if (
                    response.status === 500
                ) {

                    throw new Error(
                        data.detail ||
                        "Server authentication configuration error."
                    );
                }


                throw new Error(
                    data.detail ||
                    `Login failed with HTTP ${response.status}.`
                );
            }


            /* =================================================
               LOGIN SUCCESS
            ================================================= */

            button.textContent =
                "Verifying...";

            showStatus(
                "Login accepted. Verifying session..."
            );


            /* =================================================
               SESSION VERIFICATION
            ================================================= */

            const sessionResponse =
                await fetch(
                    `${API_URL}/api/auth/me`,
                    {
                        method: "GET",

                        credentials:
                            "include",

                        cache:
                            "no-store",

                        headers: {
                            "Accept":
                                "application/json"
                        }
                    }
                );


            if (
                !sessionResponse.ok
            ) {

                let sessionData = {};

                try {

                    sessionData =
                        await sessionResponse.json();

                } catch (
                    sessionJsonError
                ) {

                    console.warn(
                        "Could not parse session response:",
                        sessionJsonError
                    );
                }


                throw new Error(
                    sessionData.detail ||
                    `Login succeeded, but session verification returned HTTP ${sessionResponse.status}.`
                );
            }


            const sessionData =
                await sessionResponse.json();


            if (
                !sessionData.authenticated
            ) {

                throw new Error(
                    "The server did not confirm an authenticated session."
                );
            }


            /* =================================================
               SUCCESS
            ================================================= */

            button.textContent =
                "Success";

            showStatus(
                "Login successful. Opening Creator OS..."
            );


            window.location.replace(
                "index.html"
            );


        } catch (loginError) {

            console.error(
                "Creator OS login error:",
                loginError
            );


            showError(
                explainNetworkError(
                    loginError
                )
            );


            button.disabled =
                false;

            button.textContent =
                "Sign in";

            showStatus(
                "Request failed. Open the browser console for technical details."
            );
        }

    }
);


/* =========================================================
   INITIALIZATION
========================================================= */

(async function initializeLogin() {

    /*
     * First verify that the browser can reach
     * the API at all.
     */

    const apiAvailable =
        await testApiConnection();


    if (!apiAvailable) {

        button.disabled =
            true;

        return;
    }


    /*
     * Then check whether a previous
     * authenticated session exists.
     */

    await checkExistingSession();

})();

</script>


</body>

</html>
