<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Creator OS — Login
    </title>

    <script src="config.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #f5f5f5;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            color: #111;

        }


        .login {

            width: 100%;

            max-width: 390px;

            padding: 24px;

        }


        .brand {

            text-align: center;

            margin-bottom: 32px;

        }


        .brand h1 {

            margin: 0 0 8px;

            font-size: 28px;

            letter-spacing: -1px;

        }


        .brand p {

            margin: 0;

            color: #777;

            font-size: 14px;

        }


        .card {

            background: white;

            border: 1px solid #e5e5e5;

            border-radius: 18px;

            padding: 28px;

            box-shadow:
                0 12px 40px
                rgba(0,0,0,0.06);

        }


        label {

            display: block;

            margin-bottom: 8px;

            font-size: 13px;

            font-weight: 600;

        }


        input {

            width: 100%;

            padding: 13px 14px;

            border: 1px solid #ddd;

            border-radius: 10px;

            outline: none;

            font-size: 15px;

            margin-bottom: 18px;

        }


        input:focus {

            border-color: #111;

        }


        button {

            width: 100%;

            border: 0;

            border-radius: 10px;

            padding: 13px;

            background: #111;

            color: white;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

        }


        button:disabled {

            opacity: 0.5;

            cursor: wait;

        }


        .error {

            display: none;

            margin-bottom: 16px;

            padding: 11px;

            border-radius: 9px;

            background: #fff0f0;

            color: #b00020;

            font-size: 13px;

            line-height: 1.4;

        }

    </style>

</head>


<body>


    <main class="login">


        <div class="brand">

            <h1>
                Creator OS
            </h1>

            <p>
                DM Analytics & Optimization
            </p>

        </div>


        <div class="card">


            <div
                id="error"
                class="error"
            ></div>


            <form id="loginForm">


                <label for="email">
                    Email
                </label>


                <input
                    id="email"
                    type="email"
                    autocomplete="username"
                    required
                >


                <label for="password">
                    Password
                </label>


                <input
                    id="password"
                    type="password"
                    autocomplete="current-password"
                    required
                >


                <button
                    id="loginButton"
                    type="submit"
                >
                    Sign in
                </button>


            </form>


        </div>


    </main>


    <script>


        /* =========================
           ELEMENTS
        ========================= */


        const form =
            document.getElementById(
                "loginForm"
            );


        const error =
            document.getElementById(
                "error"
            );


        const button =
            document.getElementById(
                "loginButton"
            );


        const emailInput =
            document.getElementById(
                "email"
            );


        const passwordInput =
            document.getElementById(
                "password"
            );


        /* =========================
           ERROR DISPLAY
        ========================= */


        function showError(message) {

            error.textContent =
                message;

            error.style.display =
                "block";

        }


        function hideError() {

            error.textContent =
                "";

            error.style.display =
                "none";

        }


        /* =========================
           SESSION CHECK
        ========================= */


        async function checkExistingSession() {

            try {

                const response =
                    await fetch(
                        `${API_URL}/api/auth/me`,
                        {
                            method: "GET",
                            credentials: "include"
                        }
                    );


                if (response.ok) {

                    window.location.replace(
                        "index.html"
                    );

                    return true;

                }


                return false;


            } catch (sessionError) {

                console.error(
                    "Session check failed:",
                    sessionError
                );

                return false;

            }

        }


        /* =========================
           LOGIN
        ========================= */


        form.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();


                hideError();


                button.disabled =
                    true;

                button.textContent =
                    "Signing in...";


                const email =
                    emailInput.value.trim();


                const password =
                    passwordInput.value;


                try {


                    /* =====================
                       LOGIN REQUEST
                    ===================== */


                    const response =
                        await fetch(
                            `${API_URL}/api/auth/login`,
                            {
                                method: "POST",

                                credentials:
                                    "include",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({
                                        email:
                                            email,

                                        password:
                                            password
                                    })

                            }
                        );


                    let data = {};


                    try {

                        data =
                            await response.json();

                    } catch (jsonError) {

                        data = {};

                    }


                    if (!response.ok) {

                        throw new Error(
                            data.detail ||
                            "Invalid email or password"
                        );

                    }


                    /* =====================
                       VERIFY SESSION
                    ===================== */


                    button.textContent =
                        "Verifying...";


                    const sessionResponse =
                        await fetch(
                            `${API_URL}/api/auth/me`,
                            {
                                method: "GET",
                                credentials:
                                    "include"
                            }
                        );


                    if (
                        !sessionResponse.ok
                    ) {

                        throw new Error(
                            "Login succeeded, but the session could not be verified."
                        );

                    }


                    const sessionData =
                        await sessionResponse.json();


                    if (
                        !sessionData.authenticated
                    ) {

                        throw new Error(
                            "Session verification failed."
                        );

                    }


                    /* =====================
                       SUCCESS
                    ===================== */


                    button.textContent =
                        "Success";


                    window.location.replace(
                        "index.html"
                    );


                } catch (loginError) {


                    console.error(
                        "Login error:",
                        loginError
                    );


                    showError(
                        loginError.message ||
                        "Unable to sign in."
                    );


                    button.disabled =
                        false;

                    button.textContent =
                        "Sign in";

                }

            }
        );


        /* =========================
           INITIAL SESSION CHECK
        ========================= */


        checkExistingSession();


    </script>


</body>

</html>
