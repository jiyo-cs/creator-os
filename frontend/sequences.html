<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Creator OS — Sequences</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Inter",
        sans-serif;

    background: #f5f5f7;

    color: #111;

}


/* NAVIGATION */

#appNav {
    position: relative;
    z-index: 100;
}

.sidebar {

    width: 240px;

    background: #111;

    color: white;

    padding: 24px 16px;

    position: fixed;

    height: 100vh;

    top: 0;

    left: 0;

}

.logo {

    font-size: 22px;

    font-weight: 700;

    margin-bottom: 40px;

    padding-left: 12px;

}

.nav {

    display: flex;

    flex-direction: column;

    gap: 6px;

}

.nav a {

    text-decoration: none;

    color: #aaa;

    padding: 12px;

    border-radius: 10px;

    font-size: 14px;

}

.nav a:hover,
.nav a.active {

    background: #222;

    color: white;

}


/* MAIN CONTAINER */

.container {

    max-width: 1000px;

    margin-left: 240px;

    padding: 35px 20px;

}


/* PAGE */

h1 {

    font-size: 34px;

    margin-top: 10px;

    letter-spacing: -1px;

}

.subtitle {

    color: #777;

    margin-top: 8px;

    margin-bottom: 30px;

}


/* SEQUENCE */

.sequence {

    background: white;

    border: 1px solid #e5e5e5;

    border-radius: 18px;

    padding: 22px;

    margin-bottom: 14px;

}

.top {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 15px;

}

.step {

    font-weight: 700;

}

.rate {

    font-size: 24px;

    font-weight: 700;

}


/* PROGRESS BAR */

.bar {

    height: 8px;

    background: #eee;

    border-radius: 10px;

    overflow: hidden;

}

.fill {

    height: 100%;

    background: #111;

    border-radius: 10px;

}


/* STATS */

.stats {

    display: flex;

    gap: 25px;

    margin-top: 14px;

    color: #666;

    font-size: 13px;

}


/* TABLET */

@media (max-width: 900px) {

    .sidebar {

        width: 100%;

        height: auto;

        padding: 12px;

        display: flex;

        align-items: center;

        gap: 16px;

        overflow-x: auto;

    }

    .logo {

        font-size: 18px;

        margin: 0;

        padding: 0;

        flex-shrink: 0;

    }

    .nav {

        flex-direction: row;

        gap: 6px;

        overflow-x: auto;

    }

    .nav a {

        white-space: nowrap;

        padding: 9px 12px;

    }

    .container {

        margin-left: 0;

        padding: 100px 20px 30px;

    }

}


/* PHONE */

@media (max-width: 600px) {

    .container {

        padding: 85px 16px 20px;

    }

    h1 {

        font-size: 28px;

    }

    .subtitle {

        font-size: 14px;

    }

    .sequence {

        padding: 18px;

    }

    .rate {

        font-size: 21px;

    }

    .stats {

        gap: 12px;

        flex-wrap: wrap;

        font-size: 12px;

    }

}

</style>

</head>


<body>


<!-- SHARED NAVIGATION -->

<div id="appNav"></div>


<!-- MAIN CONTENT -->

<div class="container">


    <h1>
        Sequence Analytics
    </h1>


    <p class="subtitle">
        Understand where subscribers continue
        or drop out of your DM flows.
    </p>


    <div id="sequences">

        Loading...

    </div>


</div>


<!-- CONFIG -->

<script src="config.js"></script>


<!-- SHARED NAV -->

<script src="nav.js"></script>


<!-- PAGE SCRIPT -->

<script>

async function loadSequences() {

    const container =
        document.getElementById("sequences");

    try {

        const response = await fetch(
            `${API_URL}/sequences`
        );


        if (!response.ok) {

            throw new Error(
                "API request failed"
            );

        }


        const result =
            await response.json();


        const sequences =
            result.sequences || [];


        if (!sequences.length) {

            container.innerHTML = `

                <div class="sequence">

                    <strong>
                        No sequence data yet.
                    </strong>

                    <p
                        style="
                            margin-top:8px;
                            color:#777;
                        "
                    >
                        Import conversation data
                        to analyze your flows.
                    </p>

                </div>

            `;

            return;

        }


        container.innerHTML = "";


        sequences.forEach(sequence => {

            const element =
                document.createElement("div");


            element.className =
                "sequence";


            const continuationRate =
                Number(
                    sequence.continuation_rate_percent
                ) || 0;


            element.innerHTML = `

                <div class="top">

                    <div class="step">

                        ${escapeHtml(
                            sequence.step
                        )}

                    </div>


                    <div class="rate">

                        ${continuationRate}%

                    </div>

                </div>


                <div class="bar">

                    <div
                        class="fill"
                        style="
                            width:
                            ${Math.min(
                                Math.max(
                                    continuationRate,
                                    0
                                ),
                                100
                            )}%;
                        "
                    ></div>

                </div>


                <div class="stats">

                    <span>
                        Entered:
                        ${sequence.entered || 0}
                    </span>


                    <span>
                        Continued:
                        ${sequence.continued || 0}
                    </span>


                    <span>
                        Dropped:
                        ${sequence.dropped || 0}
                    </span>

                </div>

            `;


            container.appendChild(element);

        });


    } catch (error) {

        console.error(
            "Could not load sequence analytics:",
            error
        );


        container.innerHTML = `

            <div class="sequence">

                <strong>
                    API connection failed.
                </strong>

                <p
                    style="
                        margin-top:8px;
                        color:#777;
                    "
                >
                    Could not connect to the
                    Creator OS backend.
                </p>

            </div>

        `;

    }

}


/* SECURITY */

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text ?? "";

    return div.innerHTML;

}


/* LOAD */

loadSequences();

</script>


</body>

</html>
