<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Creator OS — Sequences</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Inter",
        sans-serif;

    background: #f5f5f7;

    color: #111;

}

.container {

    max-width: 1000px;

    margin: auto;

    padding: 35px 20px;

}

.back {

    color: #666;

    text-decoration: none;

    font-size: 14px;

}

h1 {

    font-size: 34px;

    margin-top: 30px;

}

.subtitle {

    color: #777;

    margin-top: 8px;

    margin-bottom: 30px;

}

.sequence {

    background: white;

    border: 1px solid #e5e5e5;

    border-radius: 18px;

    padding: 22px;

    margin-bottom: 14px;

}

.top {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 15px;

}

.step {

    font-weight: 700;

}

.rate {

    font-size: 24px;

    font-weight: 700;

}

.bar {

    height: 8px;

    background: #eee;

    border-radius: 10px;

    overflow: hidden;

}

.fill {

    height: 100%;

    background: #111;

    border-radius: 10px;

}

.stats {

    display: flex;

    gap: 25px;

    margin-top: 14px;

    color: #666;

    font-size: 13px;

}

</style>

</head>


<body>


<div class="container">


<a
    href="index.html"
    class="back"
>
    ← Dashboard
</a>


<h1>
    Sequence Analytics
</h1>


<p class="subtitle">
    Understand where subscribers continue
    or drop out of your DM flows.
</p>


<div id="sequences">

    Loading...

</div>


</div>

<script src="config.js"></script>
    
<script>


async function loadSequences() {

    const container =
        document.getElementById("sequences");

    try {

        const response = await fetch(
            `${API_URL}/sequences`
        );

        const result = await response.json();

        const sequences = result.sequences || [];

        if (!sequences.length) {

            container.innerHTML = `
                <div class="sequence">

                    <strong>
                        No sequence data yet.
                    </strong>

                    <p style="margin-top:8px;color:#777;">
                        Import conversation data
                        to analyze your flows.
                    </p>

                </div>
            `;

            return;
        }

        container.innerHTML = "";

        sequences.forEach(sequence => {

            const element =
                document.createElement("div");

            element.className = "sequence";

            element.innerHTML = `

                <div class="top">

                    <div class="step">
                        ${sequence.step}
                    </div>

                    <div class="rate">
                        ${sequence.continuation_rate_percent}%
                    </div>

                </div>

                <div class="bar">

                    <div
                        class="fill"
                        style="
                            width:
                            ${Math.min(
                                sequence.continuation_rate_percent,
                                100
                            )}%;
                        "
                    ></div>

                </div>

                <div class="stats">

                    <span>
                        Entered:
                        ${sequence.entered}
                    </span>

                    <span>
                        Continued:
                        ${sequence.continued}
                    </span>

                    <span>
                        Dropped:
                        ${sequence.dropped}
                    </span>

                </div>

            `;

            container.appendChild(element);

        });

    } catch (error) {

        container.innerHTML = `

            <div class="sequence">

                <strong>
                    API connection failed.
                </strong>

                <p style="margin-top:8px;color:#777;">
                    Make sure the Creator OS
                    backend is running.
                </p>

            </div>

        `;

    }
}


loadSequences();

</script>


</body>

</html>
