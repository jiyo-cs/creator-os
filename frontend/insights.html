<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Creator OS — AI Insights</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #111;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 40px 20px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
}

.header h1 {
    margin: 0;
    font-size: 30px;
}

.back {
    text-decoration: none;
    color: #555;
}

.section {
    margin-bottom: 35px;
}

.section h2 {
    margin-bottom: 15px;
}

.card {
    background: white;
    border-radius: 16px;
    padding: 22px;
    margin-bottom: 14px;
    border: 1px solid #e8e8e8;
}

.card h3 {
    margin: 0 0 8px;
}

.card p {
    margin: 0;
    color: #666;
    line-height: 1.5;
}

.positive {
    border-left: 5px solid #222;
}

.warning {
    border-left: 5px solid #777;
}

.neutral {
    border-left: 5px solid #aaa;
}

.priority {
    display: inline-block;
    margin-bottom: 10px;
    font-size: 12px;
    font-weight: bold;
    text-transform: uppercase;
}

.empty {
    background: white;
    padding: 30px;
    border-radius: 16px;
    color: #777;
}

</style>

</head>


<body>

<div class="container">

    <div class="header">

        <div>

            <h1>
                AI Insights
            </h1>

            <p>
                DM performance analysis and recommendations
            </p>

        </div>

        <a
            href="index.html"
            class="back"
        >
            ← Dashboard
        </a>

    </div>


    <div class="section">

        <h2>
            Insights
        </h2>

        <div id="insights">

            <div class="empty">
                Loading insights...
            </div>

        </div>

    </div>


    <div class="section">

        <h2>
            Recommended Experiments
        </h2>

        <div id="recommendations">

            <div class="empty">
                Loading recommendations...
            </div>

        </div>

    </div>

</div>

<script src="config.js"></script>
    
<script>

async function loadInsights() {

    const insightsContainer =
        document.getElementById(
            "insights"
        );

    const recommendationsContainer =
        document.getElementById(
            "recommendations"
        );


    try {

        const response =
            await fetch(
                `${API_URL}/api/insights`
            );


        const data =
            await response.json();


        if (!data.insights.length) {

            insightsContainer.innerHTML = `
                <div class="empty">
                    No insights available yet.
                    Import conversation data first.
                </div>
            `;

        } else {

            insightsContainer.innerHTML = "";

            data.insights.forEach(
                insight => {

                    const card =
                        document.createElement(
                            "div"
                        );

                    card.className =
                        `card ${insight.type}`;

                    card.innerHTML = `

                        <h3>
                            ${escapeHtml(
                                insight.title
                            )}
                        </h3>

                        <p>
                            ${escapeHtml(
                                insight.description
                            )}
                        </p>

                    `;

                    insightsContainer.appendChild(
                        card
                    );

                }
            );

        }


        recommendationsContainer.innerHTML =
            "";


        data.recommendations.forEach(
            recommendation => {

                const card =
                    document.createElement(
                        "div"
                    );

                card.className = "card";


                card.innerHTML = `

                    <span class="priority">
                        ${escapeHtml(
                            recommendation.priority
                        )}
                    </span>

                    <h3>
                        ${escapeHtml(
                            recommendation.title
                        )}
                    </h3>

                    <p>
                        ${escapeHtml(
                            recommendation.description
                        )}
                    </p>

                `;


                recommendationsContainer.appendChild(
                    card
                );

            }
        );


    } catch (error) {

        insightsContainer.innerHTML = `
            <div class="empty">
                Could not connect to Creator OS API.
            </div>
        `;

        recommendationsContainer.innerHTML = "";

    }

}


function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


loadInsights();

</script>

</body>

</html>
