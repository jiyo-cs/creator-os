<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Creator OS — Import</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Inter",
                sans-serif;

            background: #f5f5f7;
            color: #111;
            min-height: 100vh;
        }

        .container {
            max-width: 760px;
            margin: auto;
            padding: 50px 20px;
        }

        .back {
            color: #666;
            text-decoration: none;
            font-size: 14px;
        }

        h1 {
            font-size: 36px;
            margin-top: 35px;
            letter-spacing: -1px;
        }

        .subtitle {
            color: #777;
            margin-top: 8px;
            margin-bottom: 30px;
        }

        .upload-box {
            background: white;
            border: 2px dashed #ccc;
            border-radius: 20px;
            padding: 70px 30px;
            text-align: center;
            transition: 0.2s;
        }

        .upload-box:hover {
            border-color: #111;
        }

        .upload-box h2 {
            margin-bottom: 10px;
        }

        .upload-box p {
            color: #777;
            margin-bottom: 25px;
        }

        input[type="file"] {
            display: none;
        }

        .button {
            display: inline-block;
            background: #111;
            color: white;
            padding: 13px 22px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
        }

        .status {
            margin-top: 25px;
            background: white;
            border-radius: 15px;
            padding: 20px;
            display: none;
        }

        .result {
            margin-top: 15px;
            line-height: 1.8;
        }

    </style>

</head>


<body>

<div class="container">

    <a
        href="index.html"
        class="back"
    >
        ← Dashboard
    </a>


    <h1>
        Import DM Data
    </h1>

    <p class="subtitle">
        Upload a JSON export and Creator OS
        will analyze the conversations.
    </p>


    <div class="upload-box">

        <h2>
            Upload your data
        </h2>

        <p>
            CSV or JSON files supported
        </p>

        <label
            for="file"
            class="button"
        >
            Choose JSON File
        </label>

        <div
    id="fileDropZone"
    style="
        border:2px dashed #ddd;
        border-radius:14px;
        padding:40px 20px;
        text-align:center;
        cursor:pointer;
        background:#fafafa;
    "
>
    <input
        type="file"
        id="fileInput"
        accept=".json,.csv"
        style="
            display:none;
        "
    >

    <div
        style="
            font-size:16px;
            font-weight:600;
        "
    >
        Choose JSON or CSV file
    </div>

    <div
        style="
            margin-top:8px;
            color:#777;
            font-size:14px;
        "
    >
        Tap here to select a file
    </div>

</div>

    </div>


    <div
        id="status"
        class="status"
    >

        <strong id="statusTitle">
            Analyzing...
        </strong>

        <div
            id="result"
            class="result"
        ></div>

    </div>

</div>

<script src="config.js"></script>
    
<script>

const fileInput =
    document.getElementById("fileInput");
const fileDropZone =
    document.getElementById(
        "fileDropZone"
    );


fileDropZone.addEventListener(
    "click",
    function () {

        fileInput.click();

    }
);


fileInput.addEventListener(
    "change",
    function () {

        if (!fileInput.files.length) {
            return;
        }

        const file =
            fileInput.files[0];

        result.innerHTML = `
            <div class="result">
                Selected file:
                <strong>
                    ${escapeHtml(file.name)}
                </strong>
            </div>
        `;

    }
);

const uploadButton =
    document.getElementById("uploadButton");

const result =
    document.getElementById("result");


uploadButton.addEventListener(
    "click",
    uploadFile
);


async function uploadFile() {

    const file =
        fileInput.files[0];


    if (!file) {

        result.innerHTML = `
            <div class="result error">
                Please select a CSV or JSON file.
            </div>
        `;

        return;
    }


    uploadButton.disabled = true;

    uploadButton.textContent =
        "Analyzing...";


    const formData =
        new FormData();

    formData.append(
        "file",
        file
    );


    try {

        const response =
            await fetch(
                `${API_URL}/upload`,
                {
                    method: "POST",
                    body: formData
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.detail ||
                "Upload failed"
            );

        }


        const analytics =
            data.analytics;


        const summary =
            analytics.summary;


        const messages =
            analytics.messages;


        result.innerHTML = `

            <div class="result success">

                <h3>
                    Import successful
                </h3>

                <p>
                    ${data.filename}
                </p>

            </div>


            <div class="stats-grid">

                <div class="stat">

                    <span>
                        Conversations
                    </span>

                    <strong>
                        ${data.normalized_conversations}
                    </strong>

                </div>


                <div class="stat">

                    <span>
                        Reply Rate
                    </span>

                    <strong>
                        ${summary.reply_rate_percent}%
                    </strong>

                </div>


                <div class="stat">

                    <span>
                        Creator Messages
                    </span>

                    <strong>
                        ${messages.creator_messages}
                    </strong>

                </div>


                <div class="stat">

                    <span>
                        Subscriber Messages
                    </span>

                    <strong>
                        ${messages.subscriber_messages}
                    </strong>

                </div>

            </div>


            <div class="result">

                <strong>
                    ${data.skipped_rows}
                </strong>

                rows skipped during normalization.

            </div>

        `;


    } catch (error) {

        result.innerHTML = `

            <div class="result error">

                <h3>
                    Import failed
                </h3>

                <p>
                    ${error.message}
                </p>

            </div>

        `;

    }


    uploadButton.disabled = false;

    uploadButton.textContent =
        "Import & Analyze";

}

</script>

</body>

</html>
