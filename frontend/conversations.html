<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Creator OS — Conversations</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Inter",
                sans-serif;

            background: #f5f5f7;
            color: #111;
        }

        .app {
            min-height: 100vh;
        }


        /* NAVIGATION */

        .sidebar {
            width: 100%;
            background: #111;
            color: white;

            position: fixed;
            top: 0;
            left: 0;

            z-index: 100;

            padding: 12px 16px;

            display: flex;
            align-items: center;
            gap: 18px;

            overflow-x: auto;
        }

        .logo {
            font-size: 18px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .nav {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .nav a {
            text-decoration: none;
        }

        .nav button {
            border: none;
            background: transparent;
            color: #aaa;

            padding: 9px 12px;

            border-radius: 9px;

            cursor: pointer;

            font-family: inherit;
            font-size: 13px;

            white-space: nowrap;
        }

        .nav button:hover,
        .nav button.active {
            background: #222;
            color: white;
        }


        /* MAIN */

        .main {
            max-width: 1200px;
            margin: auto;

            padding: 100px 20px 40px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;

            gap: 20px;

            margin-bottom: 28px;
        }

        .header h1 {
            font-size: 32px;
            letter-spacing: -1px;
        }

        .header p {
            color: #777;
            margin-top: 6px;
        }


        /* SEARCH */

        .search {
            width: 280px;

            padding: 12px 14px;

            border: 1px solid #ddd;
            border-radius: 12px;

            background: white;

            font-size: 14px;
            outline: none;
        }

        .search:focus {
            border-color: #999;
        }


        /* SUMMARY */

        .summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;

            margin-bottom: 20px;
        }

        .summary-card {
            background: white;
            border: 1px solid #e5e5e5;

            border-radius: 16px;

            padding: 18px;
        }

        .summary-card span {
            display: block;
            color: #777;
            font-size: 13px;
            margin-bottom: 7px;
        }

        .summary-card strong {
            font-size: 24px;
        }


        /* TABLE */

        .panel {
            background: white;

            border: 1px solid #e5e5e5;

            border-radius: 18px;

            overflow: hidden;
        }

        .table-header,
        .conversation-row {

            display: grid;

            grid-template-columns:
                1.2fr
                0.7fr
                1.5fr
                1fr
                0.8fr;

            gap: 15px;

            align-items: center;

            padding: 16px 20px;
        }

        .table-header {
            background: #fafafa;

            color: #777;

            font-size: 12px;

            font-weight: 600;

            border-bottom: 1px solid #eee;
        }

        .conversation-row {
            border-bottom: 1px solid #eee;

            cursor: pointer;

            transition: 0.15s;
        }

        .conversation-row:hover {
            background: #fafafa;
        }

        .conversation-row:last-child {
            border-bottom: none;
        }

        .subscriber {
            font-weight: 600;
            font-size: 14px;
        }

        .message-preview {
            color: #666;
            font-size: 13px;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .count {
            font-size: 13px;
        }

        .date {
            color: #777;
            font-size: 13px;
        }

        .status {
            display: inline-block;

            width: fit-content;

            padding: 5px 9px;

            border-radius: 20px;

            font-size: 11px;

            font-weight: 600;

            background: #f1f1f1;
        }

        .status.replied {
            background: #e8f5ec;
            color: #217a3b;
        }

        .status.no-reply {
            background: #f5eeee;
            color: #9b3030;
        }


        /* EMPTY */

        .empty {
            padding: 60px 20px;

            text-align: center;

            color: #777;
        }

        .empty strong {
            display: block;

            color: #111;

            font-size: 16px;

            margin-bottom: 7px;
        }

        .modal-overlay {
    position: fixed;
    inset: 0;

    background: rgba(0, 0, 0, 0.55);

    z-index: 500;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;
}


.conversation-modal {
    width: 100%;
    max-width: 760px;
    max-height: 90vh;

    background: white;

    border-radius: 20px;

    overflow: hidden;

    display: flex;
    flex-direction: column;
}


.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 20px;

    border-bottom: 1px solid #eee;
}


.modal-header h2 {
    font-size: 20px;
}


.modal-header p {
    color: #777;
    font-size: 13px;
    margin-top: 4px;
}


.close-button {
    border: none;
    background: #f1f1f1;

    width: 36px;
    height: 36px;

    border-radius: 50%;

    font-size: 24px;

    cursor: pointer;
}


.conversation-meta {
    display: grid;
    grid-template-columns: repeat(3, 1fr);

    gap: 10px;

    padding: 15px 20px;

    background: #fafafa;

    border-bottom: 1px solid #eee;
}


.conversation-meta div {
    display: flex;
    flex-direction: column;
    gap: 4px;
}


.conversation-meta span {
    color: #777;
    font-size: 11px;
}


.conversation-meta strong {
    font-size: 13px;
}


.messages-container {
    padding: 20px;

    overflow-y: auto;

    flex: 1;

    background: #f5f5f7;
}


.dm-message {
    margin-bottom: 18px;

    max-width: 78%;
}


.creator-message {
    margin-left: auto;
    text-align: right;
}


.subscriber-message {
    margin-right: auto;
}


.message-sender {
    font-size: 11px;

    color: #777;

    margin-bottom: 5px;
}


.message-bubble {
    display: inline-block;

    padding: 11px 14px;

    border-radius: 15px;

    background: white;

    border: 1px solid #e5e5e5;

    font-size: 14px;

    line-height: 1.5;

    text-align: left;
}


.creator-message .message-bubble {
    background: #111;
    color: white;
    border-color: #111;
}


.message-time {
    margin-top: 4px;

    color: #999;

    font-size: 10px;
}


@media (max-width: 600px) {

    .modal-overlay {
        padding: 0;
        align-items: flex-end;
    }

    .conversation-modal {
        max-height: 94vh;
        border-radius: 20px 20px 0 0;
    }

    .conversation-meta {
        grid-template-columns: 1fr 1fr 1fr;
        padding: 12px 15px;
    }

    .messages-container {
        padding: 15px;
    }

    .dm-message {
        max-width: 88%;
    }

}


        /* MOBILE */

        @media (max-width: 700px) {

            .sidebar {
                gap: 10px;
                padding: 10px;
            }

            .logo {
                font-size: 16px;
            }

            .nav button {
                padding: 8px 9px;
                font-size: 12px;
            }

            .main {
                padding: 85px 14px 30px;
            }

            .header {
                flex-direction: column;
            }

            .header h1 {
                font-size: 27px;
            }

            .search {
                width: 100%;
            }

            .summary {
                grid-template-columns: 1fr 1fr;
            }

            .summary-card:last-child {
                grid-column: span 2;
            }

            .table-header {
                display: none;
            }

            .conversation-row {

                display: block;

                padding: 18px;
            }

            .conversation-row > div {
                margin-bottom: 8px;
            }

            .conversation-row > div:last-child {
                margin-bottom: 0;
            }

        }

    </style>

</head>


<body>

<div class="app">


    <!-- NAVIGATION -->

    <aside class="sidebar">

        <div class="logo">
            Creator OS
        </div>


        <nav class="nav">


            <a href="index.html">

                <button>
                    Overview
                </button>

            </a>


            <a href="conversations.html">

                <button class="active">
                    Conversations
                </button>

            </a>


            <a href="messages.html">

                <button>
                    DM Analytics
                </button>

            </a>


            <a href="sequences.html">

                <button>
                    Sequences
                </button>

            </a>


            <a href="insights.html">

                <button>
                    AI Insights
                </button>

            </a>


            <a href="experiments.html">

                <button>
                    Experiments
                </button>

            </a>


            <a href="reports.html">

                <button>
                    Reports
                </button>

            </a>


        </nav>

    </aside>


    <!-- MAIN -->

    <main class="main">


        <div class="header">


            <div>

                <h1>
                    Conversations
                </h1>

                <p>
                    Browse and inspect imported DM conversations.
                </p>

            </div>


            <input
                id="search"
                class="search"
                type="search"
                placeholder="Search subscriber..."
            >


        </div>


        <!-- SUMMARY -->

        <section class="summary">


            <div class="summary-card">

                <span>
                    Conversations
                </span>

                <strong id="totalConversations">
                    0
                </strong>

            </div>


            <div class="summary-card">

                <span>
                    With Reply
                </span>

                <strong id="repliedConversations">
                    0
                </strong>

            </div>


            <div class="summary-card">

                <span>
                    No Reply
                </span>

                <strong id="noReplyConversations">
                    0
                </strong>

            </div>


        </section>


        <!-- CONVERSATIONS -->

        <section class="panel">


            <div class="table-header">

                <div>
                    Subscriber
                </div>

                <div>
                    Messages
                </div>

                <div>
                    Last Message
                </div>

                <div>
                    Last Activity
                </div>

                <div>
                    Status
                </div>

            </div>


            <div id="conversationList">

                <div class="empty">

                    <strong>
                        Loading conversations...
                    </strong>

                    Please wait.

                </div>

            </div>


        </section>


    </main>

</div>


<script src="config.js"></script>


<script>

let conversations = [];

const list =
    document.getElementById("conversationList");

const search =
    document.getElementById("search");


function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function formatDate(timestamp) {

    if (!timestamp) {
        return "N/A";
    }

    const date =
        new Date(timestamp);

    if (isNaN(date.getTime())) {
        return "N/A";
    }

    return date.toLocaleString();

}


/* -----------------------------
   RENDER CONVERSATIONS
----------------------------- */

function renderConversations() {

    const query =
        search.value
            .trim()
            .toLowerCase();


    const filtered =
        conversations.filter(
            conversation =>
                String(
                    conversation.subscriber_id
                )
                .toLowerCase()
                .includes(query)
        );


    if (!filtered.length) {

        list.innerHTML = `

            <div class="empty">

                <strong>
                    No conversations found
                </strong>

                ${
                    conversations.length
                        ? "Try another search."
                        : "Import DM data first."
                }

            </div>

        `;

        return;

    }


    list.innerHTML =
        filtered.map(
            conversation => {

                const messages =
                    conversation.messages || [];


                const lastMessage =
                    messages.length
                        ? messages[messages.length - 1]
                        : null;


                const hasSubscriberMessage =
                    messages.some(
                        message =>
                            message.sender ===
                            "subscriber"
                    );


                const statusClass =
                    hasSubscriberMessage
                        ? "replied"
                        : "no-reply";


                const statusText =
                    hasSubscriberMessage
                        ? "Replied"
                        : "No reply";


                return `

                    <div
                        class="conversation-row"
                        data-id="${escapeHtml(
                            conversation.subscriber_id
                        )}"
                    >

                        <div class="subscriber">

                            ${escapeHtml(
                                conversation.subscriber_id
                            )}

                        </div>


                        <div class="count">

                            ${messages.length}

                        </div>


                        <div class="message-preview">

                            ${
                                lastMessage
                                    ? escapeHtml(
                                        lastMessage.text
                                    )
                                    : "No messages"
                            }

                        </div>


                        <div class="date">

                            ${
                                lastMessage
                                    ? formatDate(
                                        lastMessage.timestamp
                                    )
                                    : "N/A"
                            }

                        </div>


                        <div>

                            <span
                                class="status ${statusClass}"
                            >
                                ${statusText}
                            </span>

                        </div>

                    </div>

                `;

            }
        ).join("");


    /* Add click events */

    document
        .querySelectorAll(
            ".conversation-row"
        )
        .forEach(row => {

            row.addEventListener(
                "click",
                function () {

                    const id =
                        row.dataset.id;

                    openConversation(id);

                }
            );

        });

}


/* -----------------------------
   OPEN CONVERSATION
----------------------------- */

function openConversation(subscriberId) {

    const conversation =
        conversations.find(
            item =>
                String(
                    item.subscriber_id
                ) === String(subscriberId)
        );


    if (!conversation) {
        return;
    }


    const messages =
        conversation.messages || [];


    const replied =
        messages.some(
            message =>
                message.sender ===
                "subscriber"
        );


    const panel =
        document.createElement("div");


    panel.id =
        "conversationModal";


    panel.innerHTML = `

        <div class="modal-overlay">

            <div class="conversation-modal">


                <div class="modal-header">

                    <div>

                        <h2>
                            ${escapeHtml(
                                conversation.subscriber_id
                            )}
                        </h2>

                        <p>
                            ${messages.length}
                            messages
                        </p>

                    </div>


                    <button
                        id="closeConversation"
                        class="close-button"
                    >
                        ×
                    </button>

                </div>


                <div class="conversation-meta">

                    <div>

                        <span>
                            Status
                        </span>

                        <strong>
                            ${
                                replied
                                    ? "Replied"
                                    : "No reply"
                            }
                        </strong>

                    </div>


                    <div>

                        <span>
                            Messages
                        </span>

                        <strong>
                            ${messages.length}
                        </strong>

                    </div>


                    <div>

                        <span>
                            Last activity
                        </span>

                        <strong>
                            ${
                                messages.length
                                    ? formatDate(
                                        messages[
                                            messages.length - 1
                                        ].timestamp
                                    )
                                    : "N/A"
                            }
                        </strong>

                    </div>

                </div>


                <div class="messages-container">

                    ${
                        messages.length
                            ? messages.map(
                                message => `

                                    <div
                                        class="
                                            dm-message
                                            ${
                                                message.sender ===
                                                "creator"
                                                    ? "creator-message"
                                                    : "subscriber-message"
                                            }
                                        "
                                    >

                                        <div class="message-sender">

                                            ${
                                                message.sender ===
                                                "creator"
                                                    ? "Creator"
                                                    : "Subscriber"
                                            }

                                        </div>


                                        <div class="message-bubble">

                                            ${escapeHtml(
                                                message.text
                                            )}

                                        </div>


                                        <div class="message-time">

                                            ${formatDate(
                                                message.timestamp
                                            )}

                                        </div>

                                    </div>

                                `
                            ).join("")
                            : `

                                <div class="empty">
                                    No messages.
                                </div>

                            `
                    }

                </div>


            </div>

        </div>

    `;


    document.body.appendChild(panel);


    document
        .getElementById(
            "closeConversation"
        )
        .addEventListener(
            "click",
            function () {

                panel.remove();

            }
        );


    panel
        .querySelector(
            ".modal-overlay"
        )
        .addEventListener(
            "click",
            function (event) {

                if (
                    event.target ===
                    event.currentTarget
                ) {

                    panel.remove();

                }

            }
        );

}


/* -----------------------------
   LOAD DATA
----------------------------- */

async function loadConversations() {

    try {

        const response =
            await fetch(
                `${API_URL}/api/conversations`
            );


        if (!response.ok) {

            throw new Error(
                "Could not load conversations"
            );

        }


        const data =
            await response.json();


        conversations =
            data.conversations || [];


        document.getElementById(
            "totalConversations"
        ).textContent =
            conversations.length;


        const replied =
            conversations.filter(
                conversation =>
                    (conversation.messages || [])
                        .some(
                            message =>
                                message.sender ===
                                "subscriber"
                        )
            ).length;


        document.getElementById(
            "repliedConversations"
        ).textContent =
            replied;


        document.getElementById(
            "noReplyConversations"
        ).textContent =
            conversations.length -
            replied;


        renderConversations();


    } catch (error) {

        list.innerHTML = `

            <div class="empty">

                <strong>
                    Could not load conversations
                </strong>

                <p>
                    ${escapeHtml(
                        error.message
                    )}
                </p>

            </div>

        `;

    }

}


search.addEventListener(
    "input",
    renderConversations
);


loadConversations();

</script>


</body>

</html>
